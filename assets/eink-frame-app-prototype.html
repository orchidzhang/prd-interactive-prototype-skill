<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LTT原型 - UGREEN 墨水屏相框 App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .wireframe-mode {
            filter: grayscale(100%);
        }

        /* LTT 3-column layout */
        body { margin: 0; padding: 0; overflow: hidden; background: #f3f4f6; }
        .ltt-layout { display: flex; height: 100vh; width: 100vw; }
        
        /* Left: Page Tree Nav */
        .page-tree-nav {
            width: 260px;
            background: #ffffff;
            border-right: 1px solid #e5e7eb;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            z-index: 10;
        }

        /* Center: Preview Shell */
        .preview-shell {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #e5e7eb;
            position: relative;
            overflow: hidden;
        }
        .preview-stage {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            padding: 60px; /* Increased padding to leave margin top and bottom */
        }
        .monitor-wrapper {
            position: relative;
            width: 393px;
            height: 852px;
            /* Flex removed, monitor will be absolute */
        }
        .preview-monitor {
            /* phone frame */
            position: absolute;
            top: 0;
            left: 0;
            width: 393px;
            height: 852px;
            background: #1f2937; /* gray-800 */
            border-radius: 40px;
            padding: 12px; /* border thickness */
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            flex-shrink: 0;
            transform-origin: top left;
        }
        .preview-screen {
            width: 100%;
            height: 100%;
            background: #ffffff;
            border-radius: 32px;
            overflow: hidden;
            position: relative;
        }
        
        /* Right: Annotation Panel */
        .annotation-panel {
            width: 450px;
            background: #ffffff;
            border-left: 1px solid #e5e7eb;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            z-index: 10;
        }
        #annotation-content.annotation-editing {
            outline: 2px solid #059669;
            outline-offset: 2px;
            border-radius: 8px;
            min-height: 160px;
            background: #fffbeb;
            padding: 12px;
            cursor: text;
        }
        #annotation-content.annotation-editing:focus {
            outline-color: #047857;
        }
        #annotation-content ul { list-style: disc; padding-left: 1.25rem; }
        .annotation-toolbar-btn {
            font-size: 11px;
            line-height: 1;
            padding: 6px 10px;
            border-radius: 6px;
            border: 1px solid #e5e7eb;
            background: #fff;
            color: #374151;
            font-weight: 600;
            white-space: nowrap;
        }
        .annotation-toolbar-btn:hover { background: #f9fafb; }
        .annotation-toolbar-btn-primary {
            background: #111827;
            border-color: #111827;
            color: #fff;
        }
        .annotation-toolbar-btn-primary:hover { background: #1f2937; }
        .annotation-toolbar-btn-accent {
            background: #059669;
            border-color: #059669;
            color: #fff;
        }
        .annotation-toolbar-btn-accent:hover { background: #047857; }

        /* 原型导航 — 分级样式 */
        .nav-item {
            cursor: pointer;
            transition: background-color 0.15s, border-color 0.15s, color 0.15s;
            display: flex;
            align-items: center;
            gap: 0.375rem;
            border: 1px solid transparent;
            margin-bottom: 2px;
        }
        .nav-item-l0 {
            padding: 0.5rem 0.5rem;
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: #6b7280;
            background: #f3f4f6;
            border-left: 4px solid #9ca3af;
            border-radius: 0 6px 6px 0;
            margin-top: 0.5rem;
        }
        .nav-item-l0:first-child { margin-top: 0; }
        .nav-item-l1 {
            padding: 0.375rem 0.5rem;
            font-size: 11px;
            font-weight: 700;
            color: #374151;
            border-left: 3px solid #d1d5db;
            border-radius: 0 6px 6px 0;
        }
        .nav-item-l2 {
            padding: 0.3rem 0.5rem;
            font-size: 10px;
            font-weight: 600;
            color: #4b5563;
            border-radius: 6px;
        }
        .nav-item-l3 {
            padding: 0.25rem 0.5rem;
            font-size: 10px;
            font-weight: 500;
            color: #6b7280;
            border-radius: 6px;
        }
        .nav-item-l0.is-active,
        .nav-item-l0.is-descendant-active {
            background: #ecfdf5;
            border-left-color: #059669;
            color: #065f46;
        }
        .nav-item-l1.is-active,
        .nav-item-l1.is-descendant-active {
            background: #ecfdf5;
            border-left-color: #10b981;
            color: #047857;
        }
        .nav-item-l2.is-active,
        .nav-item-l2.is-descendant-active,
        .nav-item-l3.is-active {
            background: #ecfdf5;
            color: #047857;
            font-weight: 700;
            box-shadow: inset 0 0 0 1px #a7f3d0;
        }
        .nav-item:not(.is-active):not(.is-descendant-active):hover { background: #f9fafb; }
        .nav-item-l0:not(.is-active):not(.is-descendant-active):hover { background: #e5e7eb; }
        .nav-subtree-l1 { margin-top: 0.25rem; margin-left: 0.25rem; padding-left: 0.5rem; border-left: 2px solid #e5e7eb; }
        .nav-subtree-l2 { margin-top: 0.125rem; margin-left: 0.375rem; padding-left: 0.5rem; border-left: 2px dashed #e5e7eb; }
        .nav-subtree-l3 { margin-top: 0.125rem; margin-left: 0.25rem; padding-left: 0.5rem; border-left: 1px dotted #d1d5db; }
        .nav-level-tag {
            flex-shrink: 0;
            font-size: 9px;
            font-weight: 800;
            line-height: 1;
            padding: 2px 4px;
            border-radius: 4px;
            letter-spacing: 0;
            text-transform: none;
        }
        .nav-level-tag-l0 { background: #e5e7eb; color: #374151; }
        .nav-level-tag-l1 { background: #dbeafe; color: #1d4ed8; }
        .nav-level-tag-l2 { background: #fef3c7; color: #b45309; }
        .nav-level-tag-l3 { background: #f3e8ff; color: #7e22ce; }
        .nav-item-label { flex: 1; min-width: 0; line-height: 1.25; }
        .nav-item-icon { flex-shrink: 0; width: 12px; text-align: center; font-size: 10px; color: #9ca3af; }
        .nav-item.is-active .nav-item-icon,
        .nav-item.is-descendant-active .nav-item-icon { color: #059669; }
        .nav-toggle-btn {
            padding: 2px 4px;
            border-radius: 4px;
        }
        .nav-toggle-btn:hover { background: rgba(0, 0, 0, 0.06); }
    </style>
</head>
<body class="wireframe-mode text-gray-800 font-sans">

                                </div>

                            <div id="updateModal" class="hidden"></div>

                        </div>

                        <div id="detailPage" style="display:none;">
                            <div id="tab1Content"></div>
                            <div id="tab2Content" style="display:none;"></div>
                            <div id="tab3Content" style="display:none;"></div>

                </div>
            </div>
        </div>
    </div>
    </div>

    <!-- 3. 右栏：aside.annotation-panel -->

        </div>
        <div class="p-4 flex-1 overflow-y-auto text-sm text-gray-700 min-h-0">
            <div id="annotation-content">
                <!-- Dynamic annotations based on current page -->
            </div>
        </div>
    </aside>
</div>

    function confirmPhotoPickerSendNow() {
        if (state.photoPickerContext === 'now' && state.isOffline) {
            notifySendNowOfflineFailure();
            return;
        }
        const names = getPhotoPickerSelectedNames();
        if (!names.length) return;
        if (state.photoPickerContext === 'album-add') {
            state.albumAddSelectedPhotos = names;
            confirmAlbumPhotosAdd();
            return;
        }
        state.sendNowSelectedPhotos = names;
        state.previewSendContext = {
            mode: 'now',
            photoName: names[0],
            photoNames: names
        };
        closePhotoPicker();
        showToast(names.length > 1 ? `已选 ${names.length} 张，请在预览页确认后发送` : '请在预览页确认后发送');
        goToDetail('image-edit');
    }

    function confirmPhotoPickerScheduled() {
        const names = getPhotoPickerSelectedNames();
        if (!names.length) {
            showToast('请先选择照片');
            return;
        }
        if (names.length > 1) {
            showToast('定时发送每次仅可选 1 张照片', 'warning');
            return;
        }
        closePhotoPicker();
        state.scheduledSendPhotoName = names[0];
        state.scheduledSendSource = state.photoPickerTab === 'my-album' ? 'my-album' : 'phone';
        if (state.photoPickerTab === 'my-album') {
            const m = state.photoPickerSelections[0]?.key?.match(/^album:([^:]+):/);
            if (m) state.scheduledSendAlbumId = m[1];
        }
        openScheduledSendPage();
        showToast('已带入照片，请设定展示时间');
    }

    function openAlbumPhotoPickerFromSheet(source) {
        closePairModal();
        if (source === 'phone') {
            openPhotoPicker('album-add');
        } else {
            state.albumAddSelectedPhotos = [];
            goToDetail('album-add-tf');
        }
    }

    function confirmAlbumPhotosAdd() {
        const albumId = state.activeAlbumId;
        const album = getActiveAlbum();
        if (!albumId || !album) return;
        const names = [...state.albumAddSelectedPhotos];
        if (!names.length) return;
        const existing = state.albumPhotosByAlbum[albumId] || [];
        const room = ALBUM_ADD_MAX_PHOTOS - existing.length;
        if (room <= 0) {
            showToast(`相册最多 ${ALBUM_ADD_MAX_PHOTOS} 张照片`, 'warning');
            return;
        }
        const toAdd = names.slice(0, room);
        const base = Date.now();
        toAdd.forEach((name, i) => {
            existing.push({
                id: `ap${base}_${i}`,
                name,
                addedAt: base + i
            });
        });
        state.albumPhotosByAlbum[albumId] = existing;
        syncAlbumMeta(albumId);
        state.albumAddSelectedPhotos = [];
        closePhotoPicker();
        const wasTf = state.currentPage === 'album-add-tf';
        state.currentPage = 'album-detail';
        const finalCount = (state.albumPhotosByAlbum[albumId] || []).length;
        state.currentNavId = finalCount > 0 ? 'album-detail' : 'album-detail-empty';
        if (wasTf) {
            state.pageStack = state.pageStack.filter(p => p !== 'album-add-tf');
        }
        showToast(`已添加 ${toAdd.length} 张照片${names.length > toAdd.length ? `（已达上限 ${ALBUM_ADD_MAX_PHOTOS} 张）` : ''}`);
        renderCurrentPage();
    }

    function toggleTfPhotoPick(name) {
        const idx = state.albumAddSelectedPhotos.indexOf(name);
        if (idx >= 0) {
            state.albumAddSelectedPhotos.splice(idx, 1);
        } else {
            const albumId = state.activeAlbumId;
            const existing = (state.albumPhotosByAlbum[albumId] || []).length;
            const maxPick = Math.max(0, ALBUM_ADD_MAX_PHOTOS - existing);
            if (state.albumAddSelectedPhotos.length >= maxPick) {
                showToast(`最多还可添加 ${maxPick} 张`, 'warning');
                return;
            }
            state.albumAddSelectedPhotos.push(name);
        }
        renderCurrentPage();

    function formatTimelineDisplayTime(item) {
        if (item.displayAt) return formatTimelineDisplayTimeLabel(item);
        if (!item.playTime) return '';
        return String(item.playTime).replace(/^预计\s*/g, '').trim();
    }

    function getItemDisplayTimestamp(item) {
        if (item.displayAt) return new Date(item.displayAt).getTime();
        if (isScheduledDynamicItem(item) && item.playTime) {
            const m = String(item.playTime).match(/(\d{4})-(\d{2})-(\d{2})\s+(\d{1,2}):(\d{2})/);
            if (m) return new Date(`${m[1]}-${m[2]}-${m[3]}T${String(m[4]).padStart(2, '0')}:${m[5]}:00`).getTime();
        }
        const hm = item.playTime && String(item.playTime).match(/(\d{1,2}):(\d{2})/);
        if (hm) {
            const d = new Date(PROTO_TODAY);
            d.setHours(parseInt(hm[1], 10), parseInt(hm[2], 10), 0, 0);
            return d.getTime();
        }
        return typeof item.sentAt === 'number' ? item.sentAt : 0;
    }

    function formatTimelineDisplayTimeLabel(item, now = PROTO_TODAY) {
        if (item.status === 'sending') return '发送中';
        if (item.status === 'waiting') return '等待下发';
        if (item.status === 'failed') return '发送失败';
        const ts = getItemDisplayTimestamp(item);
        if (!ts) return '—';
        const d = new Date(ts);
        const today = new Date(now);
        today.setHours(0, 0, 0, 0);
        const yesterday = new Date(today);
        yesterday.setDate(yesterday.getDate() - 1);
        const day = new Date(d);
        day.setHours(0, 0, 0, 0);
        const hm = `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
        const hms = `${hm}:${String(d.getSeconds()).padStart(2, '0')}`;
        if (day.getTime() === today.getTime()) return `今天 ${hm}`;
        if (day.getTime() === yesterday.getTime()) return `昨天 ${hm}`;
        const y = d.getFullYear();
        const mo = String(d.getMonth() + 1).padStart(2, '0');
        const da = String(d.getDate()).padStart(2, '0');
        return `${y}-${mo}-${da} ${hms}`;
    }

    function getTimelineTimeLabel(item) {
        return formatTimelineDisplayTimeLabel(item);
    }

    function parseTimelineTimeSortKey(playTime, status = 'pending') {
        if (status === 'waiting' && !playTime) return 99997;
        if (!playTime) return 99998;
        const t = String(playTime).replace(/^预计\s*/g, '').trim();
        const scheduled = t.match(/^定时\s+(\d{4})-(\d{2})-(\d{2})\s+(\d{1,2}):(\d{2})/);
        if (scheduled) {
            return parseInt(scheduled[1] + scheduled[2] + scheduled[3], 10) * 10000
                + parseInt(scheduled[4], 10) * 60 + parseInt(scheduled[5], 10);
        }
        const hm = t.match(/(\d{1,2}):(\d{2})/);
        if (hm) return parseInt(hm[1], 10) * 60 + parseInt(hm[2], 10);
        return 99999;
    }

    function formatMinutesToPlayTime(totalMinutes) {
        const h = Math.floor(totalMinutes / 60) % 24;
        const m = totalMinutes % 60;
        return `${h}:${String(m).padStart(2, '0')}`;
    }

    function getNextPlayTimeForNewDynamic() {
        let maxKey = 0;
        state.displayDynamicsItems.forEach(item => {
            if (item.status === 'waiting' && !item.playTime) return;
            maxKey = Math.max(maxKey, parseTimelineTimeSortKey(item.playTime, item.status));
        });
        if (maxKey >= 99998) return '18:00';
        return formatMinutesToPlayTime(maxKey + 15);
    }

    function getTimelineDisplayItems() {
        if (state.displayDynamicsEmpty) return [];
        const max = state.displayTimelineMax || DISPLAY_TIMELINE_MAX;
        const items = [...state.displayDynamicsItems].slice(0, max);
        items.sort((a, b) => {
            if (a.status === 'playing' && b.status !== 'playing') return -1;
            if (a.status !== 'playing' && b.status === 'playing') return 1;
            if (isScheduledDynamicItem(a) && isScheduledDynamicItem(b)) {
                return getItemDisplayTimestamp(a) - getItemDisplayTimestamp(b);
            }
            if (isScheduledDynamicItem(a)) return getItemDisplayTimestamp(a) - getItemDisplayTimestamp(b);
            if (isScheduledDynamicItem(b)) return getItemDisplayTimestamp(a) - getItemDisplayTimestamp(b);
            const ta = getItemDisplayTimestamp(a);
            const tb = getItemDisplayTimestamp(b);
            if (ta !== tb) return ta - tb;
            return (b.sentAt || 0) - (a.sentAt || 0);
        });
        return items;
    }

    function getSortedDisplayDynamics() {
        return getTimelineDisplayItems();
    }

    function isScheduledDynamicItem(item) {
        return item.sendType === 'scheduled'
            || (item.playTime && String(item.playTime).startsWith('定时'))
            || (item.displayAt && item.sendType === 'scheduled');
    }

    function renderDisplayDynamicPhotoCard(item) {
        const meta = displayDynamicStatusMeta[item.status] || displayDynamicStatusMeta.pending;
        const isWaiting = item.status === 'waiting';
        const isFailed = item.status === 'failed';
        const isSending = item.status === 'sending';
        const isScheduled = isScheduledDynamicItem(item);
        const isPlaying = item.status === 'playing';
        const borderClass = isFailed ? 'border-red-300 ring-1 ring-red-100'
            : isWaiting ? 'border-amber-300 ring-1 ring-amber-100'
            : isPlaying ? 'border-green-400 ring-1 ring-green-100'

        let tagHtml = '';
        if (isPlaying) {
            tagHtml = '<span class="absolute top-1 left-1 text-[8px] font-bold px-1.5 py-0.5 rounded bg-green-600 text-white">正在展示</span>';

        if (isScheduled) {

        } else if (isPlaying) {

        } else if (isSending || isWaiting || isFailed) {
            tagHtml += `<span class="absolute top-1 right-1 inline-flex items-center text-[9px] font-medium px-1 py-0.5 rounded border bg-white/95 ${meta.tag}">

        }
        return `

                ${isWaiting ? `<div class="text-[9px] text-amber-700 mt-0.5 max-w-[160px]">${item.waitHint || '设备离线，等待下发'}</div>` : ''}
                ${isScheduled ? `

    function renderDisplayDynamicsTimeline(items, playMode, { variant = 'detail' } = {}) {

    // LTT Functions Contract
    function walkMenuNodes(visitor, nodes = menuTree) {
        for (const node of nodes) {
            visitor(node);
            if (node.children) walkMenuNodes(visitor, node.children);
        }
    }

    function findNavPath(navId, nodes = menuTree, path = []) {
        for (const node of nodes) {
            const nextPath = node.id ? [...path, node.id] : path;
            if (node.id === navId) return nextPath;
            if (node.children) {
                const found = findNavPath(navId, node.children, nextPath);
                if (found) return found;
            }
        }
        return null;
    }

    function expandMenusForNavId(navId) {
        const path = findNavPath(navId);
        if (path) path.forEach(id => { state.expandedMenus[id] = true; });
    }

    function isNavInSubtree(node, navId) {
        if (node.id === navId) return true;
        if (!node.children) return false;
        return node.children.some(child => isNavInSubtree(child, navId));
    }

    function findFirstNavIdForPage(pageId) {
        let found = null;
        walkMenuNodes(node => {
            if (!found && node.page === pageId) found = node.id || node.page;
        });
        return found || pageId;
    }

    function ensureSheetClosed() {
        const sheet = document.getElementById('bottom-sheet');
        const content = document.getElementById('bottom-sheet-content');
        if (!sheet || !content) return;
        content.classList.add('translate-y-full');
        sheet.classList.add('hidden');
        sheet.classList.remove('flex');
        sheet.style.display = 'none';
    }

    function findFirstNavigableMenuNode(node) {
        if (node.page) return node;
        if (!node.children?.length) return null;
        for (const child of node.children) {
            const found = findFirstNavigableMenuNode(child);
            if (found) return found;
        }
        return null;
    }

    function navigateToMenu(node) {
        if (node.children?.length) {
            const first = findFirstNavigableMenuNode(node);
            if (first && first !== node) {
                navigateToMenu(first);
                return;
            }
        }
        if (node.page) {
            if (state.currentPage !== node.page) {
                state.pageStack.push(state.currentPage);
            }
            state.currentPage = node.page;
            state.currentNavId = node.id || node.page;
            expandMenusForNavId(state.currentNavId);
            if (node.stateOverride) {
                Object.assign(state, node.stateOverride);
            }
            if (node.id === 'log-single') {
                restoreDefaultDisplayDynamics();
            }
            if (node.page === 'frame-log') {
                state.expandedMenus['frame-log'] = true;
            }
            
            // update offline icon based on state
            document.getElementById('wifi-icon').className = state.isOffline ? 'fas fa-link-slash text-gray-400' : 'fas fa-wifi';
            ensureSheetClosed();
            renderCurrentPage();

        const movable = state.displayDynamicsItems.filter(i => i.status === 'pending' && !isScheduledDynamicItem(i));
        if (movable.length < 2) {

            return;
        }
        const timeSlots = movable
            .map(i => ({ displayAt: i.displayAt, playTime: i.playTime }))
            .sort((a, b) => getItemDisplayTimestamp(a) - getItemDisplayTimestamp(b));
        for (let i = movable.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [movable[i], movable[j]] = [movable[j], movable[i]];
        }
        movable.forEach((item, idx) => {
            item.displayAt = timeSlots[idx].displayAt;
            item.playTime = timeSlots[idx].playTime;
        });
        showToast('已打乱照片顺序，时间轴不变');
        renderCurrentPage();

            state.displayHistoryItems.splice(payload, 1);

            state.displayDynamicsItems = playing;
            state.displayDynamicsEmpty = playing.length === 0;

            state.displayDynamicsItems = state.displayDynamicsItems.filter(item => item.id !== payload);
            state.displayDynamicsEmpty = state.displayDynamicsItems.length === 0;
            showToast('记录已删除');
        } else if (action === 'delete-photos') {
            state.photoLibrary = state.photoLibrary.filter(photo => !payload.includes(photo.id));
            state.hasPhotos = state.photoLibrary.length > 0;
            state.selectedPhotoIds = [];
            state.myPhotosSelectMode = false;
            showToast('照片已删除');
        } else if (action === 'cancel-share') {
            state.shareMembers = state.shareMembers.filter(item => item.id !== payload);
            showToast('已取消共享');
        } else if (action === 'reject-share') {
            state.shareIncomingRequests = state.shareIncomingRequests.filter(item => item.id !== payload);
            showToast('已拒绝共享邀请');
        } else if (action === 'delete-album') {
            const albumId = payload;
            state.albumList = state.albumList.filter(a => a.id !== albumId);
            delete state.albumPhotosByAlbum[albumId];
            state.myPhotosHasAlbums = state.albumList.length > 0;

        state.pendingAction = null;
        closePairModal();
        renderCurrentPage();
    }

    // —— 需求标注：可编辑并覆盖写入本 HTML 文件 ——
    const pageAnnotations = {};
    let annotationEditMode = false;
    let annotationEditSnapshot = '';
    let annotationsDocumentDirty = false;
    let htmlFileHandle = null;

    function getPageAnnotation(pageId) {
        if (pageAnnotations[pageId] !== undefined) return pageAnnotations[pageId];
        const fallback = pages[pageId]?.annotation;
        return fallback ? String(fallback).trim() : '';
    }

    function initPageAnnotations() {
        Object.keys(pages).forEach(pageId => {
            if (pages[pageId]?.annotation) {
                pageAnnotations[pageId] = String(pages[pageId].annotation).trim();
            }
        });
    }

    function escapeAnnotationForTemplateLiteral(html) {
        return String(html)
            .replace(/\\/g, '\\\\')
            .replace(/`/g, '\\`')
            .replace(/\$\{/g, '\\${');
    }

    function patchPageAnnotationInHtml(html, pageId, annotationHtml) {
        const keyPattern = new RegExp(`(['"])${pageId.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')}\\1\\s*:\\s*\\{`);
        const keyMatch = keyPattern.exec(html);
        if (!keyMatch) return html;
        const annIdx = html.indexOf('annotation:', keyMatch.index + keyMatch[0].length);
        if (annIdx === -1) return html;
        const tickStart = html.indexOf('`', annIdx);
        if (tickStart === -1) return html;
        let tickEnd = tickStart + 1;
        while (tickEnd < html.length) {
            const nextTick = html.indexOf('`', tickEnd);
            if (nextTick === -1) return html;
            let backslashes = 0;
            for (let i = nextTick - 1; i >= tickStart && html[i] === '\\'; i--) backslashes++;
            if (backslashes % 2 === 0) {
                tickEnd = nextTick;
                break;
            }
            tickEnd = nextTick + 1;
        }
        const body = escapeAnnotationForTemplateLiteral(annotationHtml);
        const replacement = '`\n                ' + body + '\n            `';
        return html.slice(0, tickStart) + replacement + html.slice(tickEnd + 1);
    }

    function buildHtmlDocumentString() {

    function updateAnnotationToolbar() {
        const toolbar = document.getElementById('annotation-toolbar');
        const hint = document.getElementById('annotation-hint');
        if (!toolbar) return;

        if (annotationEditMode) {
            toolbar.innerHTML = `
                <button type="button" class="annotation-toolbar-btn annotation-toolbar-btn-accent" onclick="saveAnnotationEdit()">完成</button>
                <button type="button" class="annotation-toolbar-btn" onclick="cancelAnnotationEdit()">取消</button>
            `;
            if (hint) hint.textContent = '正在编辑：可直接修改富文本；点「完成」后将覆盖写入本 HTML 文件。';
            return;
        }

        const linkBtn = htmlFileHandle
            ? ''
            : `<button type="button" class="annotation-toolbar-btn" onclick="linkHtmlFileForSave()">关联 HTML</button>`;
        toolbar.innerHTML = `
            <button type="button" class="annotation-toolbar-btn" onclick="startAnnotationEdit()">编辑</button>
            ${linkBtn}
        `;
        if (hint) {
            if (annotationsDocumentDirty) {
                hint.textContent = '有未写入文件的修改 · 请关联 HTML 后重新点「完成」，或 Ctrl+S 写入';
            } else if (htmlFileHandle) {
                hint.textContent = '已关联 HTML · 编辑后点「完成」直接覆盖原文件 · Ctrl+S 快捷写入';
            } else {
                hint.textContent = '请先点「关联 HTML」选择本原型文件，之后编辑将直接覆盖写入，不会另存为新文件';
            }
        }
    }

    function startAnnotationEdit() {

    async function saveAnnotationEdit() {
        const panel = document.getElementById('annotation-content');
        if (!panel) return;
        const pageId = state.currentPage;
        const html = panel.innerHTML.trim();
        pageAnnotations[pageId] = html;
        if (pages[pageId]) pages[pageId].annotation = html;
        annotationEditMode = false;
        panel.contentEditable = 'false';
        panel.classList.remove('annotation-editing');
        updateAnnotationToolbar();
        const saved = await writeHtmlToLinkedFile({ silent: true });
        if (saved) {
            showToast('标注已写入 HTML 文件');
        } else {
            annotationsDocumentDirty = true;
            updateAnnotationToolbar();
            showToast('标注已更新，请关联 HTML 文件后写入', 'warning');
        }
    }

    function buildHtmlDocumentString() {
        const doctype = '<!DOCTYPE html>';
        let html = doctype + '\n' + document.documentElement.outerHTML;
        Object.keys(pageAnnotations).forEach(pageId => {
            html = patchPageAnnotationInHtml(html, pageId, pageAnnotations[pageId]);
        });
        return html;
    }

    async function writeHtmlToLinkedFile({ silent = false, promptLink = true } = {}) {
        const html = buildHtmlDocumentString();

        if (!htmlFileHandle) {
            if (!promptLink) return false;
            if (!silent) showToast('请先关联本 HTML 文件', 'warning');
            await linkHtmlFileForSave();
            if (!htmlFileHandle) return false;
        }

        if (!('createWritable' in htmlFileHandle)) {
            showToast('当前环境无法直接写入，请使用 Chrome/Edge 打开并关联文件', 'warning');
            return false;
        }

        try {
            const writable = await htmlFileHandle.createWritable();
            await writable.write(html);
            await writable.close();
            annotationsDocumentDirty = false;
            updateAnnotationToolbar();
            if (!silent) showToast('已覆盖写入 HTML 文件');
            return true;
        } catch (err) {
            console.warn('写入 HTML 失败', err);
            htmlFileHandle = null;
            updateAnnotationToolbar();
            showToast('写入失败，请重新关联 HTML 文件', 'error');
            return false;
        }
    }

    async function linkHtmlFileForSave() {
        if (!('showOpenFilePicker' in window)) {
            showToast('当前浏览器不支持直接写入，请用 Chrome/Edge 打开本 HTML', 'warning');
            return false;
        }
        try {
            const [handle] = await window.showOpenFilePicker({
                types: [{ description: 'HTML 文件', accept: { 'text/html': ['.html'] } }],
                multiple: false
            });
            htmlFileHandle = handle;
            showToast('已关联 HTML 文件，编辑后将直接覆盖写入');
            updateAnnotationToolbar();
            if (annotationsDocumentDirty) {
                await writeHtmlToLinkedFile({ silent: true, promptLink: false });
            }
            return true;
        } catch (err) {
            if (err && err.name !== 'AbortError') showToast('关联文件失败', 'error');
            return false;
        }
    }

    function renderPageTree() {
        const menu = document.getElementById('nav-menu');
        menu.innerHTML = '';

        function getNavVisualLevel(level, isParent) {
            if (level === 0 && !isParent) return 1;
            return Math.min(level, 3);
        }

        function getNavLevelTag(level, isParent) {
            const visualLevel = getNavVisualLevel(level, isParent);
            const labels = ['分组', '模块', '页面', '状态'];
            const cls = ['l0', 'l1', 'l2', 'l3'][visualLevel];
            return `<span class="nav-level-tag nav-level-tag-${cls}">${labels[visualLevel]}</span>`;
        }

        function getNavLeadingIcon(level, isParent, isExpanded) {
            const visualLevel = getNavVisualLevel(level, isParent);
            if (visualLevel === 0) return '<i class="nav-item-icon fa-solid fa-layer-group"></i>';
            if (visualLevel === 1) {
                if (isParent) return `<i class="nav-item-icon fa-solid ${isExpanded ? 'fa-folder-open' : 'fa-folder'}"></i>`;
                return '<i class="nav-item-icon fa-solid fa-mobile-screen"></i>';
            }
            if (visualLevel === 2) {
                if (isParent) return `<i class="nav-item-icon fa-solid ${isExpanded ? 'fa-folder-open' : 'fa-folder'}"></i>`;
                return '<i class="nav-item-icon fa-regular fa-file-lines"></i>';
            }
            return '<i class="nav-item-icon fa-solid fa-circle-dot" style="font-size:6px"></i>';
        }

        function getNavSubtreeClass(level) {
            if (level === 0) return 'nav-subtree-l1 space-y-0.5';
            if (level === 1) return 'nav-subtree-l2 space-y-0.5';
            return 'nav-subtree-l3 space-y-0.5';
        }

        function renderNode(node, parentElement, level = 0) {
            const isParent = !!node.children?.length;
            const isExpanded = state.expandedMenus[node.id] !== false;
            const isActive = state.currentNavId === (node.id || node.page);
            const isDescendantActive = isParent && isNavInSubtree(node, state.currentNavId) && !isActive;

            const visualLevel = getNavVisualLevel(level, isParent);
            const li = document.createElement('li');
            const levelClass = `nav-item-l${visualLevel}`;
            const stateClass = isActive ? 'is-active' : (isDescendantActive ? 'is-descendant-active' : '');
            li.className = `nav-item ${levelClass} ${stateClass}`.trim();

            li.innerHTML = `
                ${getNavLevelTag(level, isParent)}
                ${getNavLeadingIcon(level, isParent, isExpanded)}
                <span class="nav-item-label">${node.name}</span>
                ${isParent ? `<i class="fa-solid ${isExpanded ? 'fa-caret-down' : 'fa-caret-right'} text-gray-400 text-[9px] shrink-0 nav-toggle-btn" data-nav-toggle aria-label="展开或收起"></i>` : ''}
            `;

            li.onclick = (e) => {
                e.stopPropagation();
                if (e.target.closest('[data-nav-toggle]')) {
                    if (isParent) {
                        state.expandedMenus[node.id] = !isExpanded;
                        renderPageTree();
                    }
                    return;
                }
                navigateToMenu(node);
            };
            parentElement.appendChild(li);

            if (isParent && isExpanded) {
                const ul = document.createElement('ul');
                ul.className = getNavSubtreeClass(level);
                node.children.forEach(child => renderNode(child, ul, level + 1));
                parentElement.appendChild(ul);
            }
        }

        menuTree.forEach(node => renderNode(node, menu, 0));
    }

    function pushDisplayDynamic({ name, sender = '我', status = 'pending', playTime, displayAt, waitHint = '设备离线，等待下发', sendType = null, failReason = null }) {
        const id = `d${Date.now()}`;
        const isWaiting = status === 'waiting';
        const isFailed = status === 'failed';
        const isSending = status === 'sending';
        const resolvedPlayTime = isWaiting || isFailed || isSending
            ? (playTime || null)
            : (playTime || getNextPlayTimeForNewDynamic());
        const item = {
            id,
            name,
            sender,
            status,
            playTime: resolvedPlayTime,
            sentAt: Date.now(),
            sendType: sendType || (resolvedPlayTime && String(resolvedPlayTime).startsWith('定时') ? 'scheduled' : null)
        };
        if (displayAt) {
            item.displayAt = displayAt;
        } else if (item.sendType === 'scheduled' && resolvedPlayTime) {
            const m = String(resolvedPlayTime).match(/(\d{4})-(\d{2})-(\d{2})\s+(\d{1,2}):(\d{2})/);
            if (m) item.displayAt = `${m[1]}-${m[2]}-${m[3]}T${String(m[4]).padStart(2, '0')}:${m[5]}:00`;
        } else if (resolvedPlayTime && status !== 'waiting' && status !== 'failed' && status !== 'sending') {
            const hm = String(resolvedPlayTime).match(/(\d{1,2}):(\d{2})/);
            if (hm) {
                const d = new Date(PROTO_TODAY);
                d.setHours(parseInt(hm[1], 10), parseInt(hm[2], 10), 0, 0);
                item.displayAt = d.toISOString().slice(0, 19);
            }
        }
        if (isWaiting) item.waitHint = waitHint;
        if (isFailed && failReason) item.failReason = failReason;
        state.displayDynamicsItems.push(item);
        state.displayDynamicsEmpty = false;
    }

    function confirmPreviewAndSend() {
        const ctx = state.previewSendContext;
        if (!ctx) {
            showToast('请先完成选图');
            return;
        }
        const names = ctx.photoNames?.length ? ctx.photoNames : (ctx.photoName ? [ctx.photoName] : []);
        if (!names.length) {
            showToast('请先完成选图');
            return;
        }
        if (ctx.mode === 'scheduled') {
            pushDisplayDynamic({
                name: ctx.photoName,
                status: 'pending',
                playTime: `定时 ${ctx.scheduledAt}`,
                sendType: 'scheduled'
            });
            showToast('定时任务已插入时间轴，播完后间隔一个展示间隔继续原列表');
        } else if (ctx.mode === 'album') {
            if (state.isOffline) {
                notifySendNowOfflineFailure();
                return;
            }
            switchDisplayPlanMode('album', { clearPlan: true });
            if (ctx.albumId) state.activeDisplayAlbumId = ctx.albumId;
            names.forEach((name, idx) => {
                pushDisplayDynamic({
                    name,
                    sender: getActiveDisplayAlbumSender(),
                    status: idx === 0 ? 'playing' : 'pending'
                });
            });
            showToast(`已切换相册模式并发送 ${names.length} 张，原计划已清空`);
        } else if (ctx.mode === 'now' || ctx.mode === 'art') {
            if (state.isOffline) {
                notifySendNowOfflineFailure();
                return;
            }
            switchDisplayPlanMode('single', { clearPlan: true });
            names.forEach((name, idx) => {
                pushDisplayDynamic({ name, status: idx === 0 ? 'playing' : 'pending' });
            });
            showToast(names.length > 1
                ? `已切换图片模式并发送 ${names.length} 张，原计划已清空`
                : '已切换图片模式并发送，原计划已清空');
        } else {
            showToast('任务加入队列，设备唤醒时下发');
            state.previewSendContext = null;
            goBack(ctx.backPage || 'device-home');
            return;
        }
        const backPage = ctx.backPage || (ctx.mode === 'scheduled' ? 'scheduled-send' : 'device-home');
        state.previewSendContext = null;
        goBack(backPage);
    }

    // Monitor Layout Auto-Resize
    function resizeMonitor() {
        const stage = document.getElementById('preview-stage');
        const wrapper = document.getElementById('monitor-wrapper');
        const monitor = document.getElementById('preview-monitor');
        if (!stage || !wrapper || !monitor) return;
        
        // 120px padding total (60px * 2)
        const stageWidth = stage.clientWidth - 120;
        const stageHeight = stage.clientHeight - 120;
        
        // Calculate max scale to fit inside stage
        const scale = Math.min(1, stageWidth / 393, stageHeight / 852);
        
        // Apply transform and force wrapper layout size
        monitor.style.transform = `scale(${scale})`;
        wrapper.style.width = `${393 * scale}px`;
        wrapper.style.height = `${852 * scale}px`;
    }

    window.addEventListener('resize', resizeMonitor);

    // Initialize
    initPageAnnotations();
    goToHome();
    
    // Ensure initial scale calculation
    setTimeout(resizeMonitor, 0);
