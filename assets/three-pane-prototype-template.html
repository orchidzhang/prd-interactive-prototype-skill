    function nasToast(msg) {
        const el = document.getElementById('nas-toast');
        el.textContent = msg;
        el.classList.add('show');
        clearTimeout(nasToast._t);
        nasToast._t = setTimeout(() => el.classList.remove('show'), 2200);
    }

    function setPlatform(p) {
        state.platform = p;
        const mon = document.getElementById('preview-monitor');
        mon.classList.toggle('mode-app', p === 'app');
        mon.classList.toggle('mode-desktop', p === 'desktop');
        document.getElementById('btn-platform-app').classList.toggle('active', p === 'app');
        document.getElementById('btn-platform-desktop').classList.toggle('active', p === 'desktop');
        updateTabBarVisibility();
        renderNasApp();
        resizeMonitor();
        renderPageTree();
    }

    function isDesktop() { return state.platform === 'desktop'; }

    function renderPhotoPlaceholder(iconClass = '') {
        return `<div class="img-placeholder"><i class="fa-regular fa-image ${iconClass}"></i></div>`;
    }

    function isPhotoSelected(name) {
        return state.gallerySelected.includes(name);
    }

    function getActiveDevice() {
        return state.devices.find(d => d.id === state.activeDeviceId) || state.devices[0];
    }

    function getPhotoDate(name) {
        if (photoDates[name]) return photoDates[name];
        timelineGroups.forEach(g => g.photos.forEach(p => { if (p.name === name) photoDates[name] = p.date; }));
        return photoDates[name] || '2026-05-01';
    }

    function formatPhotoDate(iso) {
        if (!iso) return '';
        const p = iso.split('-');
        if (p.length === 3) return `${parseInt(p[1], 10)}月${parseInt(p[2], 10)}日`;
        return iso;
    }

    function getAllGalleryPhotos() {
        const names = [];
        Object.values(nasFolders).forEach(items => {
            items.filter(i => i.type === 'file').forEach(f => names.push(f.name));
        });
        return [...new Set(names)];
    }

    function getGalleryStreamPhotos() {
        const base = getAllGalleryPhotos();
        const stream = [];
        while (stream.length < 48) {
            base.forEach(name => stream.push(name));
        }
        return stream.slice(0, 48);
    }

    function setGalleryStreamMode(mode) {
        if (state.gallerySendSelectMode) cancelGallerySendSelect(false);
        state.galleryStreamMode = mode;
        if (mode === 'folder') {
            state.galleryPath = '/Homes/Photos';

    function getEventClientPoint(evt) {
        if (!evt) return null;
        if (evt.touches && evt.touches[0]) return { x: evt.touches[0].clientX, y: evt.touches[0].clientY };
        if (evt.changedTouches && evt.changedTouches[0]) return { x: evt.changedTouches[0].clientX, y: evt.changedTouches[0].clientY };
        if (typeof evt.clientX === 'number') return { x: evt.clientX, y: evt.clientY };
        return null;
    }

    function positionPhotoFloatMenu(clientX, clientY) {
        const root = document.getElementById('nasapp-root');
        const menu = document.getElementById('photo-float-menu');
        if (!root || !menu) return;
        const rect = root.getBoundingClientRect();
        const pad = 8;
        menu.classList.remove('hidden');
        const mw = menu.offsetWidth;
        const mh = menu.offsetHeight;
        let left = clientX - rect.left;
        let top = clientY - rect.top;
        left = Math.max(pad, Math.min(left, rect.width - mw - pad));
        top = Math.max(pad, Math.min(top, rect.height - mh - pad));
        menu.style.left = `${left}px`;
        menu.style.top = `${top}px`;
    }

    function openGalleryPhotoSendMenu(name, evt) {
        const esc = name.replace(/'/g, "\\'");
        const menu = document.getElementById('photo-float-menu');
        const backdrop = document.getElementById('photo-float-backdrop');
        if (!menu || !backdrop) return;
        closeNasSheet();
        menu.innerHTML = `
            <button type="button" role="menuitem" onclick="enterGallerySendSelectMode('${esc}')">
                <i class="fa-solid fa-tablet-screen-button"></i>发送到相框
            </button>`;
        backdrop.classList.remove('hidden');
        let pt = getEventClientPoint(evt);
        if (!pt) {
            const cell = document.querySelector(`[data-photo-name="${name.replace(/"/g, '\\"')}"]`);
            if (cell) {
                const r = cell.getBoundingClientRect();
                pt = { x: r.left + r.width / 2, y: r.top + r.height / 2 };
            } else {
                const root = document.getElementById('nasapp-root');
                const r = root.getBoundingClientRect();
                pt = { x: r.left + r.width / 2, y: r.top + r.height / 2 };
            }
        }
        positionPhotoFloatMenu(pt.x, pt.y);
        state.currentNavId = 'library-stream-longpress';
        updateAnnotation();
    }

    function bindPhotoLongPress(root) {
        if (!root || state.gallerySendSelectMode) return;
        root.querySelectorAll('[data-photo-longpress]').forEach(node => {
            const name = node.getAttribute('data-photo-name');
            if (!name) return;
            const sendOnly = node.getAttribute('data-photo-menu') === 'send-only';
            const openMenu = (e) => (sendOnly ? openGalleryPhotoSendMenu : openPhotoContextMenu)(name, e);
            let timer = null;
            let pressEvent = null;
            const clearPress = () => {
                if (timer) { clearTimeout(timer); timer = null; }
                pressEvent = null;
            };
            const start = (e) => {
                if (e.type === 'mousedown' && e.button !== 0) return;
                if (timer) clearTimeout(timer);
                pressEvent = e;
                timer = setTimeout(() => {
                    const ev = pressEvent;
                    timer = null;
                    pressEvent = null;
                    openMenu(ev);
                }, 480);
            };
            node.addEventListener('touchstart', start, { passive: true });
            node.addEventListener('mousedown', start);
            node.addEventListener('touchend', clearPress);
            node.addEventListener('touchmove', clearPress);
            node.addEventListener('mouseup', clearPress);
            node.addEventListener('mouseleave', clearPress);
            node.addEventListener('contextmenu', (e) => {
                e.preventDefault();
                clearPress();
                openMenu(e);
            });
        });
    }

    function openAlbumSendMenu(albumId, evt) {
        closeNasSheet();
        closePhotoFloatMenu();

        const esc = albumId.replace(/'/g, "\\'");
        const menu = document.getElementById('photo-float-menu');
        const backdrop = document.getElementById('photo-float-backdrop');
        if (!menu || !backdrop) return;
        menu.innerHTML = `
            <button type="button" role="menuitem" onclick="sendMyAlbumToFrame('${esc}')">
                <i class="fa-solid fa-tablet-screen-button"></i>发送到相框
            </button>`;
        backdrop.classList.remove('hidden');
        let pt = getEventClientPoint(evt);
        if (!pt) {
            const cell = document.querySelector(`[data-album-id="${albumId.replace(/"/g, '\\"')}"]`);
            if (cell) {
                const r = cell.getBoundingClientRect();
                pt = { x: r.left + r.width / 2, y: r.top + r.height / 2 };
            } else {
                const root = document.getElementById('nasapp-root');
                const r = root.getBoundingClientRect();
                pt = { x: r.left + r.width / 2, y: r.top + r.height / 2 };
            }
        }
        positionPhotoFloatMenu(pt.x, pt.y);
        updateAnnotation();

    function bindAlbumLongPress(root) {
        if (!root) return;
        root.querySelectorAll('[data-album-longpress]').forEach(node => {

                openAlbumSendMenu(albumId, e);
            };
            let timer = null;
            let pressEvent = null;
            const clearPress = () => {
                if (timer) { clearTimeout(timer); timer = null; }
                pressEvent = null;
            };
            const start = (e) => {
                if (e.type === 'mousedown' && e.button !== 0) return;
                if (timer) clearTimeout(timer);
                pressEvent = e;
                timer = setTimeout(() => {
                    const ev = pressEvent;
                    timer = null;
                    pressEvent = null;
                    openMenu(ev);
                }, 480);
            };
            node.addEventListener('touchstart', start, { passive: true });
            node.addEventListener('mousedown', start);
            node.addEventListener('touchend', clearPress);
            node.addEventListener('touchmove', clearPress);
            node.addEventListener('mouseup', clearPress);
            node.addEventListener('mouseleave', clearPress);
            node.addEventListener('contextmenu', (e) => {
                e.preventDefault();
                clearPress();
                openMenu(e);
            });
        });

    function sendAlbumToFrame() {
        closeAlbumDetailMenu();
        const album = getActiveAlbum();
        if (!album) return;
        const selected = state.gallerySelected.length ? state.gallerySelected : getAlbumPhotoNames(album.path);
        if (!selected.length) {
            nasToast('相册暂无照片');
            return;
        }
        if (state.gallerySelected.length) {
            clearSendAlbumContext();
        } else {
            setSendAlbumContext(album, selected.length);
        }
        state.sendPhotos = selected.slice(0, 9);
        if (state.gallerySelected.length) {
            state._returnAlbumDetail = true;
        } else {
            state._sendAlbumImmediate = true;
            state._goDeviceHomeAfterSend = true;
            state._returnAlbumDetail = false;
        }
        state.activeAlbumId = album.id;
        state.libraryAlbumBrowse = true;
        state._browseAlbumName = album.name;
        state.galleryPath = album.path;
        openSendPickTargetPage(state.gallerySelected.length ? 'library-send-pick' : 'library-send-pick-album');
