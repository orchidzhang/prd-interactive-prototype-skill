                        <button type="button" class="w-full flex items-center gap-3 p-3.5 border border-gray-200 rounded-xl text-left hover:bg-gray-50" onclick="enterScheduledPickNasAlbum()">
                            <div class="w-10 h-10 rounded-lg bg-gray-100 flex items-center justify-center shrink-0"><i class="fa-regular fa-folder text-gray-600"></i></div>
                            <div class="flex-1 font-bold text-sm">我的相册</div>
                            <i class="fa-solid fa-chevron-right text-gray-300 text-xs"></i>
                        </button>
                    </div>
                </div>`;
        return `
        <div class="h-full min-h-0 bg-gray-50 flex flex-col">
            <div class="flex items-center p-4 bg-white border-b border-gray-200 shrink-0">
                <button type="button" class="w-10 h-10 flex items-center justify-center -ml-2 text-gray-800" onclick="nasGoBack()"><i class="fa-solid fa-chevron-left"></i></button>
                <h2 class="font-bold text-lg flex-1 text-center pointer-events-none -ml-10">定时设置</h2>
            </div>
            <div class="flex-1 min-h-0 overflow-y-auto p-4 space-y-4 pb-4">
                ${previewTargetCard}
                <div class="bg-white rounded-xl border border-gray-200 p-4 shadow-sm">
                    <div class="text-[11px] font-bold text-gray-600 mb-3">设定展示时间</div>
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="text-[10px] text-gray-500 block mb-1">日期</label>
                            <input type="date" value="${state.scheduledSendDate}" class="w-full border border-gray-300 rounded-lg px-2 py-2 text-sm" onchange="state.scheduledSendDate=this.value" />
                        </div>
                        <div>
                            <label class="text-[10px] text-gray-500 block mb-1">时间</label>
                            <input type="time" value="${state.scheduledSendTime}" class="w-full border border-gray-300 rounded-lg px-2 py-2 text-sm" onchange="state.scheduledSendTime=this.value" />
                        </div>
                    </div>
                    <p class="text-[10px] text-gray-400 mt-2">可选当日及以后的日期</p>
                </div>
                ${photoPickBlock}
            </div>
            <div class="shrink-0 p-4 pt-0 bg-gray-50">
                <button type="button" class="w-full py-3 rounded-full text-sm font-bold ${canConfirm ? 'bg-gray-900 text-white' : 'bg-gray-300 text-white'}" ${canConfirm ? 'onclick="confirmScheduledSend()"' : 'disabled'}>确认定时展示</button>
            </div>
        </div>`;
    }

    function confirmScheduledSend() {
        if (!state.scheduledSendDate || !state.scheduledSendTime) {
            nasToast('请选择日期与时间');
            return;
        }
        if (!state.scheduledSendPhoto) {
            nasToast('请选择一张照片');
            return;
        }
        state.planEmpty = false;
        state.planItems.push({
            id: 'pl-s' + Date.now(),
            name: state.scheduledSendPhoto,
            sender: '我',
            status: 'pending',
            playTime: `定时 ${state.scheduledSendDate} ${state.scheduledSendTime}`,
            sendType: 'scheduled'
        });
        const fromSend = !!state._scheduledFromSendFlow;
        nasToast('定时展示已设置，计划已更新');
        state._scheduledFromSendFlow = false;
        state.scheduledSendPhoto = null;
        if (fromSend) {
            finishSendFlow('queue', { skipToast: true });
            return;
        }
        if (returnAfterDeviceHomeSend()) return;
        state.currentPage = 'library';
        state.libraryTab = 'gallery';
        if (state.pageStack.length && state.pageStack[state.pageStack.length - 1] === 'library') state.pageStack.pop();
        state.currentNavId = 'library-folders';
        renderNasApp();
        updateAnnotation();
        renderPageTree();
    }

    function renderGalleryTabPage() {
        const selectMode = state.gallerySendSelectMode;
        const wrapClass = `gallery-stream-wrap${selectMode ? ' select-mode' : ''}`;
        const bottomPad = ' pb-24';
        const viewSwitcher = selectMode ? '' : renderGalleryViewSwitcher();
        if (state.galleryStreamMode === 'folder') {
            const foldersBody = renderGalleryFoldersPane();
            return `
            <div class="h-full flex flex-col bg-white min-h-0">
                ${renderGalleryHeader()}
                <div class="${wrapClass}">
                    <div class="flex flex-1 flex-col min-h-0${bottomPad}">${foldersBody}</div>
                    ${viewSwitcher}
                </div>
            </div>`;
        }

        const photos = getGalleryStreamPhotos();
        const grid = photos.map((name, idx) => renderGalleryStreamCell(name, idx)).join('');
        return `
        <div class="h-full flex flex-col bg-white min-h-0">
            ${renderGalleryHeader()}
            <div class="${wrapClass}">
                <div class="gallery-stream-scroll${bottomPad}">
                    <div class="gallery-stream-grid">${grid}</div>
                </div>
                ${viewSwitcher}
            </div>
        </div>`;
    }

    function renderAlbumsTabPage() {
        const timePreview = timelineAlbums.filter(a => !a.monthly).slice(0, 4);
        const timeCards = timePreview.map(renderTimeScrollCard).join('');
        const myGrid = nasAlbums.map(renderMyAlbumTile).join('');
        return `
        <div class="flex-1 overflow-y-auto min-h-0 bg-white pb-2">
            ${renderAlbumsHeader()}
            <div class="albums-section-head">
                <button type="button" class="flex items-center gap-1 text-base font-bold text-gray-900" onclick="openTimeAlbumHub()">
                    时光<i class="fa-solid fa-chevron-right text-[10px] text-gray-400"></i>
                </button>
            </div>
            <div class="time-scroll-h mb-5">${timeCards}</div>
            <div class="albums-section-head"><h2>我的相册</h2></div>
            <div class="my-album-grid">${myGrid}</div>
        </div>`;
    }

    function renderTimeAlbumListPage() {
        const timeAlbums = timelineAlbums.filter(a => !a.monthly).concat(timelineAlbums.filter(a => a.monthly));
        const cards = timeAlbums.map(a => renderTimeCard(a, { grid: true })).join('');
        const header = isDesktop() ? '' : `
            <div class="time-hub-header">
                <button type="button" class="w-9 h-9 flex items-center justify-center text-gray-800 -ml-1" onclick="closeTimeAlbumHub()" aria-label="返回">
                    <i class="fa-solid fa-chevron-left"></i>
                </button>
                <h2>时光</h2>
                <button type="button" class="w-9 h-9 flex items-center justify-center text-gray-700 -mr-1" onclick="nasToast('筛选与排序')"><i class="fa-solid fa-sliders"></i></button>
            </div>`;
        return `
        <div class="flex-1 flex flex-col min-h-0 bg-white">
            ${header}
            <div class="flex-1 overflow-y-auto min-h-0">
                <div class="time-grid">${cards}</div>
            </div>
        </div>`;
    }

    function renderSmartClassifyPage() {
        const people = smartClassifyPeople.map(p => `
            <button type="button" class="smart-chip" onclick="openSmartPerson('${p.id}')">
                <div class="smart-avatar img-placeholder"><i class="fa-regular fa-user"></i></div>
                <div class="smart-label">${p.name}</div>
                <div class="smart-count">${p.count} 张</div>
            </button>
        `).join('');
        const cats = smartClassifyCategories.map(c => `
            <button type="button" class="smart-cat-card" onclick="openSmartCategory('${c.id}')">
                <div class="smart-cat-ph img-placeholder"><i class="fa-regular fa-image"></i></div>
                <div class="smart-cat-name">${c.name}</div>
                <div class="smart-cat-meta">${c.meta} · ${c.count} 张</div>
            </button>
        `).join('');
        return `
        <div class="flex-1 overflow-y-auto min-h-0 bg-white pb-2">
            <div class="album-home-header">
                <div class="flex items-start justify-between gap-3">
                    <div class="min-w-0">
                        <h1 class="text-[28px] font-bold text-gray-900 leading-none">智能分类</h1>
                        <p class="text-[11px] text-gray-500 mt-2">NAS 本地 AI · 人脸 / 地点 / 场景</p>
                    </div>
                    ${renderAppCloseBtn()}
                </div>
            </div>
            <div class="smart-section-title pt-2">人物</div>
            <div class="smart-chip-scroll">${people}</div>
            <div class="smart-section-title">更多分类</div>
            <div class="smart-cat-grid">${cats}</div>
        </div>`;
    }

    function renderAlbumHomePage() {
        return renderAlbumsTabPage();
    }

    function setAlbumFitMode(id) {
        if (!albumFitModeOptions.some(o => o.id === id)) return;
        const dev = getActiveDevice();
        if (dev) dev.albumFitMode = id;
        nasToast(`剪裁策略：${albumFitModeOptions.find(o => o.id === id).label}`);
        renderNasApp();
    }

    function renderLibrarySettingsPage() {
        return `
        <div class="flex-1 overflow-y-auto min-h-0 bg-gray-50 pb-6">
            <div class="album-home-header bg-white border-b border-gray-100">
                <div class="flex items-start justify-between gap-3">
                    <div class="min-w-0">
                        <h1 class="text-[28px] font-bold text-gray-900 leading-none">设置</h1>
                        <p class="text-[11px] text-gray-500 mt-2">图库 · NAS 本机偏好</p>
                    </div>
                    ${renderAppCloseBtn()}
                </div>
            </div>

            <div class="settings-section">
                <div class="settings-section-title">图库</div>
                <div class="settings-group">
                    <button type="button" class="settings-row w-full text-left" onclick="nasToast('索引与缩略图管理')">
                        <span>照片索引</span><i class="fa-solid fa-chevron-right text-xs text-gray-300"></i>
                    </button>
                    <button type="button" class="settings-row w-full text-left" onclick="nasToast('局域网直传设置')">
                        <span>发送到相框</span><span class="text-xs text-gray-400">局域网直传</span>
                    </button>
                    <button type="button" class="settings-row w-full text-left border-b-0" onclick="nasToast('存储空间')">
                        <span>存储空间</span><span class="text-xs text-gray-400">DX4600 · Photos</span>
                    </button>
                </div>
            </div>

            <div class="settings-section">
                <div class="settings-section-title">关于</div>
                <div class="settings-group">
                    <div class="settings-row border-b-0">
                        <span class="text-gray-500">NAS 图库套件</span>
                        <span class="text-xs text-gray-400">v0.1 原型</span>
                    </div>
                </div>
            </div>
        </div>`;
    }

    function renderLibraryStubPage(title, desc) {
        return `
        <div class="flex-1 flex flex-col items-center justify-center px-8 text-center bg-white min-h-0">
            ${renderImgPlaceholder('w-24 h-24 rounded-2xl mb-4')}
            <h2 class="font-bold text-gray-800 mb-2">${title}</h2>
            <p class="text-xs text-gray-400 leading-relaxed">${desc}</p>
        </div>`;
    }

    function renderDesktopLibrarySubNav() {
        return `
            <div class="shrink-0 bg-white border-b border-gray-200 px-3 py-2 flex gap-1">
                ${libraryTabs.map(t => {
                    if (t.disabled) {
                        return `<span class="px-3 py-1.5 rounded-lg text-xs font-bold text-gray-300 cursor-default select-none">${t.label}</span>`;
                    }
                    return `
                    <button type="button" class="px-3 py-1.5 rounded-lg text-xs font-bold ${state.libraryTab === t.id ? 'bg-gray-900 text-white' : 'text-gray-500 hover:bg-gray-100'}"
                            onclick="switchLibraryTab('${t.id}')">${t.label}</button>`;
                }).join('')}
            </div>`;
    }

    function switchNasTab(tab) {
        openNasAppModule(tab === 'library' ? 'library' : 'smarthome');
    }

    function getTimelineAlbum(id) {
        return timelineAlbums.find(a => a.id === id);
    }

    function openTimeAlbumHub() {
        state.timelineView = 'time-list';
        state.activeTimelineAlbumId = null;
        state.libraryTab = 'albums';
        state.libraryView = 'timeline';
        state.currentNavId = 'library-time-hub';
        renderNasApp();
        updateAnnotation();
        renderPageTree();
    }

    function closeTimeAlbumHub() {
        state.timelineView = 'list';
        state.activeTimelineAlbumId = null;
        state.currentNavId = 'library-albums';
        renderNasApp();
        updateAnnotation();
        renderPageTree();
    }

    function openTimelineAlbum(albumId) {
        state._timelineReturnView = state.timelineView === 'time-list' ? 'time-list' : 'list';
        state.activeTimelineAlbumId = albumId;
        state.timelineView = 'detail';
        state.libraryView = 'timeline';
        state.libraryTab = 'albums';
        state.currentPage = 'library';
        state.nasTab = 'library';
        state.activeNasModule = 'library';
        const navMap = {
            'that-year-today': 'library-timeline-that-year',
            'three-years-ago': 'library-timeline-three-years',
            wedding: 'library-timeline-wedding',
            birthday: 'library-timeline-birthday',
            monthly: 'library-timeline-monthly',
            'june-pick': 'library-time-hub'
        };
        state.currentNavId = navMap[albumId] || 'library-albums';
        renderNasApp();
        updateAnnotation();
        renderPageTree();
    }

    function closeTimelineAlbumDetail() {
        state.timelineView = state._timelineReturnView || 'list';
        state.activeTimelineAlbumId = null;
        state.currentNavId = state.timelineView === 'time-list' ? 'library-time-hub' : 'library-albums';
        renderNasApp();
        updateAnnotation();
        renderPageTree();
    }

    function playTimelineAlbumToDevice(albumId, evt) {
        if (evt) evt.stopPropagation();
        const album = getTimelineAlbum(albumId);
        if (!album) return;
        const dev = getActiveDevice();
        dev.carouselAlbum = `时光 · ${album.name}`;
        dev.playMode = 'album';
        state.carouselAlbumName = dev.carouselAlbum;
        state.currentNavId = resolveDeviceHomeNavId();
        nasToast(dev.online ? `「${album.name}」已设为相册轮播 · ${dev.name}` : `「${album.name}」已设置，等待设备上线`);
        renderNasApp();
        updateAnnotation();
        renderPageTree();
    }

    function renderTimelineAlbumCard(album) {
        const esc = album.id.replace(/'/g, "\\'");
        return `
        <button type="button" class="timeline-album-card" onclick="openTimelineAlbum('${esc}')">
            <div class="tl-cover">${renderPhotoPlaceholder()}</div>
            <div class="tl-body">
                <div class="flex items-center gap-1.5 text-[10px] text-gray-500 mb-1">
                    <i class="fa-solid ${album.icon}"></i><span>${album.hint}</span>
                </div>
                <div class="font-bold text-sm text-gray-900">${album.name}</div>
                <div class="text-[11px] text-gray-500 mt-0.5">${album.tagline} · ${album.count} 张</div>
            </div>
            <i class="fa-solid fa-chevron-right tl-chevron"></i>
        </button>`;
    }

    function renderTimelineAlbumList() {
        const cards = timelineAlbums.map(renderTimelineAlbumCard).join('');
        return `
            <div class="px-4 py-3 shrink-0">
                <p class="text-[11px] text-gray-500 leading-relaxed">根据日期与纪念日规则，从 NAS 照片库自动聚合。点击相册进入详情，可多选发送到相框。</p>
            </div>
            <div class="flex-1 overflow-y-auto px-4 pb-4 min-h-0">
                <div class="${isDesktop() ? 'timeline-album-grid' : 'space-y-3'}">${cards}</div>
            </div>`;
    }

    function renderTimelinePhotoGrid(photos, cols) {
        const gridCols = cols || (isDesktop() ? 'grid-cols-5' : 'grid-cols-3');
        return `<div class="grid ${gridCols} gap-2">${photos.map(p => renderThumbTile(p.name, { date: p.date })).join('')}</div>`;
    }

    function renderTimelineAlbumDetail() {
        const album = getTimelineAlbum(state.activeTimelineAlbumId);
        if (!album) return '<p class="p-4 text-gray-500">相册不存在</p>';

        let content = '';
        if (album.monthly) {
            content = timelineGroups.map(g => {
                const photos = g.photos.map(p => renderThumbTile(p.name, { date: p.date, sizeClass: isDesktop() ? 'aspect-square rounded-lg' : 'aspect-square rounded-lg w-full', compact: true })).join('');
                return `
                <section class="mb-5">
                    <h3 class="text-sm font-bold text-gray-800 mb-2 flex items-center gap-2">
                        ${g.highlight ? '<i class="fa-solid fa-calendar-day text-gray-500"></i>' : '<span class="timeline-dot"></span>'}
                        ${g.label}
                        <span class="text-[11px] font-normal text-gray-400">${g.badge || g.desc || ''}</span>
                    </h3>
                    <div class="grid ${isDesktop() ? 'grid-cols-5' : 'grid-cols-3'} gap-2">${photos}</div>
                </section>`;
            }).join('');
        } else {
            content = (album.groups || []).map(g => `
                <section class="mb-5">
                    <h3 class="text-sm font-bold text-gray-800 mb-2">${g.label}</h3>
                    ${renderTimelinePhotoGrid(g.photos)}
                </section>
            `).join('');
        }

        const header = isDesktop()
            ? `<div class="px-5 py-3 bg-white border-b flex items-center gap-3 shrink-0">
                    <button type="button" class="text-gray-600" onclick="closeTimelineAlbumDetail()"><i class="fa-solid fa-arrow-left"></i></button>
                    <div class="flex-1 min-w-0">
                        <h2 class="font-bold">${album.name}</h2>
                        <p class="text-xs text-gray-500">${album.tagline} · ${album.count} 张</p>
                    </div>
                    <button type="button" class="text-xs font-bold border border-gray-300 px-3 py-1.5 rounded-lg" onclick="playTimelineAlbumToDevice('${album.id}', event)">
                        <i class="fa-solid fa-play mr-1"></i>整册轮播
                    </button>
               </div>`
            : `<div class="px-4 py-3 bg-white border-b sticky top-0 z-10 shrink-0">
                    <div class="flex items-center gap-2 mb-1">
                        <button type="button" class="w-8 h-8 flex items-center justify-center -ml-1" onclick="closeTimelineAlbumDetail()"><i class="fa-solid fa-arrow-left"></i></button>
                        <h2 class="font-bold text-base flex-1">${album.name}</h2>
                        <button type="button" class="text-[11px] font-bold text-gray-700 border border-gray-300 px-2 py-1 rounded-lg" onclick="playTimelineAlbumToDevice('${album.id}', event)">整册轮播</button>
                    </div>
                    <p class="text-[11px] text-gray-500 pl-7">${album.tagline} · ${album.count} 张 · 仅显示日期</p>
               </div>`;

        return `${header}<div class="flex-1 overflow-y-auto p-4 min-h-0">${content}</div>`;
    }

    function resolveTabFallback() {
        if (state.nasTab === 'library' || state.activeNasModule === 'library') return 'library';
        return 'family';
    }

    function renderLibraryBody() {
        if (state.libraryTab === 'albums') {
            if (state.libraryAlbumBrowse) {
                return renderAlbumDetailPage();
            }
            if (state.timelineView === 'detail' && state.activeTimelineAlbumId) {
                return renderTimelineAlbumDetail();
            }
            if (state.timelineView === 'time-list') {
                return renderTimeAlbumListPage();
            }
            return renderAlbumsTabPage();
        }
        if (state.libraryTab === 'gallery') {
            if (state.libraryAlbumBrowse) {
                return renderAlbumDetailPage();
            }
            return renderGalleryTabPage();
        }
        if (state.libraryTab === 'smart') {
            return renderSmartClassifyPage();
        }
        if (state.libraryTab === 'settings') {
            return renderLibrarySettingsPage();
        }
        return '';
    }

    function switchNasPage(page, push = true) {
        if (push && state.currentPage !== page) state.pageStack.push(state.currentPage);
        state.currentPage = page;
        renderNasApp();
    }

    function nasGoBack() {
        const prev = state.pageStack.pop();
        if (prev !== undefined) {
            state.currentPage = prev;
            if (prev === 'device-home') {
                state.nasTab = 'family';
                state.activeNasModule = 'smarthome';
                applyDeviceHomeP0Context();
                state.currentNavId = resolveDeviceHomeNavId();
                state._sendReturnToDeviceHome = false;
                state._sendAlbumImmediate = false;
            } else if (prev === 'family') state.currentNavId = 'family-list';
            else if (prev === 'library') {
                state.currentNavId = state.libraryView === 'timeline'
                    ? (state.activeTimelineAlbumId ? state.currentNavId : 'library-albums')
                    : 'library-folders';
            }
        } else if (state.currentPage === 'device-settings' || state.currentPage === 'device-plan-settings') {
            state.currentPage = state._deviceSettingsReturn || 'device-home';
            if (state.currentPage === 'device-home') applyDeviceHomeP0Context();
            state.currentNavId = state.currentPage === 'send-device' ? 'library-send' : resolveDeviceHomeNavId();
        } else if (state.currentPage === 'scheduled-send') {
            state._scheduledFromSendFlow = false;
            state.currentPage = 'library';
            state.currentNavId = state.libraryView === 'timeline' ? 'library-albums' : 'library-folders';
        } else if (state.currentPage === 'send-device' || state.currentPage === 'send-pick-target') {
            state.currentPage = 'library';
            state.currentNavId = state.libraryView === 'timeline' ? 'library-albums' : 'library-folders';
        } else if (state.currentPage === 'family' || state.currentPage === 'library') {
            goAppHome();
            return;
        } else {
            state.currentPage = resolveTabFallback();
            if (state.currentPage === 'family') state.currentNavId = 'family-list';
        }
        renderNasApp();
        updateAnnotation();
        renderPageTree();
    }

    function applyDeviceHomeP0Context() {
        state.deviceHomeVariant = 'p0';
        const dev = getActiveDevice();
        state.planViewMode = dev?.playMode === 'album' ? 'album' : 'image';
    }

    function resolveDeviceHomeNavId() {
        if (state.deviceHomeVariant !== 'p0') return 'device-home';
        return state.planViewMode === 'image' ? 'device-home-p0-image' : 'device-home-p0-album';
    }

    function openDeviceHome(deviceId) {
        state.activeDeviceId = deviceId;
        state._sendReturnToDeviceHome = false;
        state._sendAlbumImmediate = false;
        applyDeviceHomeP0Context();
        if (state.currentPage !== 'device-home') state.pageStack.push(state.currentPage);
        state.currentPage = 'device-home';
        state.nasTab = 'family';
        state.activeNasModule = 'smarthome';
        state.currentNavId = resolveDeviceHomeNavId();
        state.carouselAlbumName = getActiveDevice().carouselAlbum || state.carouselAlbumName;
        renderNasApp();
        updateAnnotation();
        renderPageTree();
    }

    function openDevicePlanSettings(returnTo) {
        const targetId = state.sendTargetId || state.activeDeviceId || state.devices[0]?.id;
        if (targetId) {
            state.activeDeviceId = targetId;
            if (returnTo === 'send-device') state.sendTargetId = targetId;
        }
        state._deviceSettingsReturn = returnTo || 'device-home';
        if (state.currentPage !== 'device-plan-settings') state.pageStack.push(state.currentPage);
        state.currentPage = 'device-plan-settings';
        state.nasTab = returnTo === 'send-device' ? state.nasTab : 'family';
        state.activeNasModule = returnTo === 'send-device' ? state.activeNasModule : 'smarthome';
        state.planViewMode = getActiveDevice().playMode === 'album' ? 'album' : 'image';
        state.currentNavId = state.planViewMode === 'image' ? 'device-plan-image' : 'device-plan-settings';
        state.carouselAlbumName = getActiveDevice().carouselAlbum || state.carouselAlbumName;
        renderNasApp();
        updateAnnotation();
        renderPageTree();
    }

    function openDeviceSettings(returnTo) {
        const targetId = state.sendTargetId || state.activeDeviceId || state.devices[0]?.id;
        if (targetId) {
            state.activeDeviceId = targetId;
            if (returnTo === 'send-device') state.sendTargetId = targetId;
        }
        state._deviceSettingsReturn = returnTo || 'device-home';
        if (state.currentPage !== 'device-settings') state.pageStack.push(state.currentPage);
        state.currentPage = 'device-settings';
        state.nasTab = returnTo === 'send-device' ? state.nasTab : 'family';
        state.activeNasModule = returnTo === 'send-device' ? state.activeNasModule : 'smarthome';
        state.currentNavId = 'device-settings';
        state.carouselAlbumName = getActiveDevice().carouselAlbum || state.carouselAlbumName;
        renderNasApp();
        updateAnnotation();
        renderPageTree();
    }

    function renderDeviceFramePreview() {
        const dev = getActiveDevice();
        const hasPreview = dev.current && dev.current !== '—';
        const framePreviewInner = hasPreview
            ? `<div class="absolute inset-0 img-placeholder"><i class="fa-regular fa-image"></i></div>`
            : `<div class="absolute inset-0 flex items-center justify-center text-gray-400 text-sm">暂无画面</div>`;
        return `<div class="frame-preview w-full">${framePreviewInner}</div>`;
    }

    function isScheduledPlanItem(item) {
        return item.sendType === 'scheduled' || (item.playTime && String(item.playTime).startsWith('定时'));
    }

    function getSortedPlanItems() {
        const rank = { playing: 0, pending: 1, waiting: 2 };
        return [...state.planItems].sort((a, b) => (rank[a.status] ?? 3) - (rank[b.status] ?? 3));
    }

    function setDisplayInterval(id) {
        state.displayInterval = id;
        nasToast('展示间隔已更新，设备联网后生效');
        renderNasApp();
    }

    function isPlanAlbumMode() {
        return state.planViewMode !== 'image';
    }

    function resolvePlanNavId() {
        return isPlanAlbumMode() ? 'device-plan-settings' : 'device-plan-image';
    }

    function isPlanDisplayPaused() {
        if (!isPlanAlbumMode()) return state.planPaused;
        const dev = getActiveDevice();
        return dev.playMode === 'album' ? state.albumCarouselPaused : state.planPaused;
    }

    function togglePlanPause() {
        if (!isPlanAlbumMode()) {
            state.planPaused = !state.planPaused;
            nasToast(state.planPaused ? '展示已停止，当前画面不变' : '已恢复轮播');
            renderNasApp();
            return;
        }
        const dev = getActiveDevice();
        if (dev.playMode === 'album') {
            state.albumCarouselPaused = !state.albumCarouselPaused;
            nasToast(state.albumCarouselPaused ? '展示已停止，当前画面不变' : '已恢复轮播');
        } else {
            state.planPaused = !state.planPaused;
            nasToast(state.planPaused ? '展示已停止，当前画面不变' : '已恢复轮播');
        }
        renderNasApp();
    }

    function openClearPlanConfirm() {
        const items = state.planEmpty ? [] : state.planItems;
        const hasClearable = items.some(i => i.status !== 'playing');
        if (!hasClearable) return;
        openNasSheet(`
            <div class="p-4 border-b font-bold">一键清空</div>
            <div class="p-4 text-sm text-gray-600 leading-relaxed">清空待播列表，设备当前展示的照片不变。</div>
            <div class="p-3 border-t flex gap-2">
                <button type="button" class="flex-1 py-2.5 rounded-xl border border-gray-300 text-sm font-bold text-gray-700" onclick="closeNasSheet()">取消</button>
                <button type="button" class="flex-1 py-2.5 rounded-xl bg-red-600 text-white text-sm font-bold" onclick="executeClearPlan()">确认清空</button>
            </div>
        `);
    }

    function executeClearPlan() {
        const playing = state.planItems.find(i => i.status === 'playing');
        state.planItems = playing ? [playing] : [];
        state.planEmpty = !state.planItems.length;
        closeNasSheet();
        nasToast('列表已清空，当前展示不变');
        if (state.planEmpty) state.currentNavId = resolveDeviceHomeNavId();
        else state.currentNavId = resolvePlanNavId();
        renderNasApp();
        updateAnnotation();
        renderPageTree();
    }

    function openRemovePlanItemConfirm(itemId) {
        const item = state.planItems.find(i => i.id === itemId);
        if (!item || item.status === 'playing') return;
        const safeName = item.name.replace(/</g, '&lt;').replace(/>/g, '&gt;');
        openNasSheet(`
            <div class="p-4 border-b font-bold">移出时间轴</div>
            <div class="p-4 text-sm text-gray-600 leading-relaxed">
                确认将「${safeName}」从时间轴移除？<br>
                <span class="text-xs text-gray-400">仅移除展示计划，不会删除 NAS 中的原始照片。</span>
            </div>
            <div class="p-3 border-t flex gap-2">
                <button type="button" class="flex-1 py-2.5 rounded-xl border border-gray-300 text-sm font-bold text-gray-700" onclick="closeNasSheet()">取消</button>
                <button type="button" class="flex-1 py-2.5 rounded-xl bg-red-600 text-white text-sm font-bold" onclick="executeRemovePlanItem('${itemId}')">确认移除</button>
            </div>
        `);
    }

    function executeRemovePlanItem(itemId) {
        const before = state.planItems.length;
        state.planItems = state.planItems.filter(i => i.id !== itemId || i.status === 'playing');
        if (state.planItems.length === before) return;
        state.planEmpty = !state.planItems.length;
        closeNasSheet();
        nasToast('已从时间轴移除，原图保留在 NAS');
        if (state.planEmpty) state.currentNavId = resolveDeviceHomeNavId();
        else state.currentNavId = resolvePlanNavId();
        renderNasApp();
        updateAnnotation();
        renderPageTree();
    }

    function shufflePlanQueue() {
        if (state.planEmpty || !state.planItems.length) return;
        const slots = state.planItems
            .map((item, idx) => ({ item, idx }))
            .filter(({ item }) => item.status !== 'playing');
        if (slots.length < 2) {
            nasToast('没有其他照片可打乱');
            return;
        }
        const images = slots.map(({ item }) => ({ name: item.name, sender: item.sender }));
        for (let i = images.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [images[i], images[j]] = [images[j], images[i]];
        }
        slots.forEach(({ item }, i) => {
            item.name = images[i].name;
            item.sender = images[i].sender;
        });
        nasToast('已打乱待播图片，时间不变');
        renderNasApp();
    }

    function openPlanAlbumPicker() {
        const rows = nasAlbums.map(a => {
            const esc = a.id.replace(/'/g, "\\'");
            return `<button type="button" class="w-full text-left px-4 py-3 text-sm hover:bg-gray-50 rounded-lg flex justify-between items-center" onclick="selectPlanCarouselAlbum('${esc}')">
                <span class="font-medium">${a.name}</span>
                <span class="text-xs text-gray-400">${a.count} 张 · ${a.type}</span>
            </button>`;
        }).join('');
        openNasSheet(`
            <div class="p-4 border-b font-bold">选择轮播图册</div>
            <div class="p-2 max-h-[50vh] overflow-y-auto">${rows}</div>
            <div class="p-3 border-t"><button type="button" class="w-full py-2 text-sm text-gray-600" onclick="closeNasSheet()">取消</button></div>
        `);
    }

    function selectPlanCarouselAlbum(albumId) {
        const album = nasAlbums.find(a => a.id === albumId);
        if (!album) return;
        const dev = getActiveDevice();
        dev.carouselAlbum = album.name;
        dev.playMode = 'album';
        state.carouselAlbumName = album.name;
        state.albumCarouselPaused = false;
        closeNasSheet();
        nasToast(dev.online ? `已切换为相册轮播 · ${album.name}` : `已设置相册轮播，等待设备上线`);
        state.currentNavId = resolveDeviceHomeNavId();
        renderNasApp();
        updateAnnotation();
        renderPageTree();
    }

    function switchPlanPlayMode(mode) {
        const dev = getActiveDevice();
        dev.playMode = mode;
        if (mode === 'single') {
            state.currentNavId = resolveDeviceHomeNavId();
        } else {
            if (!dev.carouselAlbum) dev.carouselAlbum = nasAlbums[0]?.name || '日本旅行';
            state.carouselAlbumName = dev.carouselAlbum;
            state.currentNavId = resolveDeviceHomeNavId();
        }
        renderNasApp();
        updateAnnotation();
        renderPageTree();
    }

    function renderPlanTimelineCard(item, isAlbumMode) {
        const isWaiting = item.status === 'waiting';
        const isScheduled = isScheduledPlanItem(item);
        const isPlaying = item.status === 'playing';
        const canRemove = !isAlbumMode && !isPlaying;
        const borderClass = isWaiting ? 'border-amber-300 ring-1 ring-amber-100' : (isPlaying ? 'border-green-400 ring-1 ring-green-100' : 'border-gray-200');
        const statusTag = isScheduled
            ? '<span class="absolute top-1 right-1 text-[8px] font-bold px-1 py-0.5 rounded bg-amber-500 text-white">定时</span>'
            : (isPlaying ? '<span class="absolute top-1 right-1 text-[8px] bg-green-600 text-white px-1 rounded font-bold">NOW</span>'
                : (isWaiting ? '<span class="absolute top-1 right-1 text-[8px] font-bold px-1 py-0.5 rounded bg-amber-100 text-amber-800">等待</span>' : ''));
        const removeBtn = canRemove ? `
            <button type="button"
                class="absolute right-1 bottom-1 w-6 h-6 rounded-full bg-white/95 text-red-600 border border-red-100 shadow flex items-center justify-center"
                onclick="event.stopPropagation();openRemovePlanItemConfirm('${item.id}')"
                aria-label="移出时间轴">
                <i class="fa-regular fa-trash-can text-[10px]"></i>
            </button>` : '';
        return `
        <div class="relative shrink-0">
            <div class="w-[88px] h-[66px] bg-gray-100 rounded-lg border ${borderClass} overflow-hidden relative">
                <div class="absolute inset-0 img-placeholder"><i class="fa-regular fa-image text-lg"></i></div>
                ${statusTag}
                ${removeBtn}
            </div>
            ${isWaiting ? `<div class="mt-1 text-[9px] text-amber-700 leading-tight max-w-[88px]">${item.waitHint || '等待下发'}</div>` : ''}
        </div>`;
    }

    function renderPlanTimeline(items, isAlbumMode) {
        if (!items.length) return '';
        const hint = `共 ${items.length} 张`;
        const rows = items.map((item, idx) => {
            const isLast = idx === items.length - 1;
            const scheduled = isScheduledPlanItem(item);
            const waiting = item.status === 'waiting';
            const dotClass = item.status === 'playing' ? 'bg-green-500 ring-green-100' : (waiting ? 'bg-amber-500 ring-amber-100' : 'bg-gray-300 ring-gray-100');
            const timeLabel = scheduled ? item.playTime.replace('定时 ', '') : (waiting ? '—' : (item.playTime || '—'));
            return `
            <div class="relative flex gap-3 ${isLast ? '' : 'pb-4'}">
                <div class="flex flex-col items-center w-16 shrink-0">
                    <div class="text-xs font-bold text-gray-900 text-center leading-tight">${timeLabel}</div>
                    ${scheduled ? '<div class="text-[9px] text-amber-600 font-bold mt-0.5">定时</div>' : (waiting ? '<div class="text-[9px] text-amber-600 mt-0.5">等待下发</div>' : (!isAlbumMode ? `<div class="text-[9px] text-gray-400 mt-0.5 truncate w-full text-center">${item.sender}</div>` : ''))}
                    <div class="w-2 h-2 rounded-full ${dotClass} ring-4 mt-2 shrink-0"></div>
                    ${!isLast ? '<div class="w-0.5 flex-1 bg-gray-200 mt-1 min-h-[40px]"></div>' : ''}
                </div>
                <div class="pt-0.5">${renderPlanTimelineCard(item, isAlbumMode)}</div>
            </div>`;
        }).join('');
        return `
        <div class="bg-white rounded-xl border border-gray-200 p-4 shadow-sm">
            <div class="flex justify-between items-center mb-3">
                <div class="text-xs font-bold text-gray-800 flex items-center gap-2"><i class="fa-regular fa-clock text-gray-500"></i>时间轴</div>
                <span class="text-[10px] text-gray-400">${hint}</span>
            </div>
            <div>${rows}</div>
        </div>`;
    }

    function getAlbumFitModeLabel(dev) {
        const id = dev?.albumFitMode || 'smart-cover';
        return albumFitModeOptions.find(o => o.id === id)?.label || '智能铺满';
    }

    function getDisplayOrientationLabel(dev) {
        return dev?.displayOrientation === 'portrait' ? '竖屏摆放' : '横屏摆放';
    }

    function copyDeviceSerial() {
        const dev = getActiveDevice();
        if (!dev?.serialNumber) return;
        nasToast(`已复制 ${dev.serialNumber}`);
    }

    function getDefaultFilterLabel(dev) {
        const id = dev?.einkAlgorithm || 'standard';
        return sendPreviewFilterOptions.find(o => o.id === id)?.label || sendPreviewFilterOptions[0].label;
    }

    function setDeviceDefaultFilter(id) {
        if (!sendPreviewFilterOptions.some(o => o.id === id)) return;
        const dev = getActiveDevice();
        if (dev) dev.einkAlgorithm = id;
        closeNasSheet();
        nasToast(`默认滤镜：${getDefaultFilterLabel(dev)}`);
        renderNasApp();
    }

    function openDeviceDefaultFilterSheet() {
        const dev = getActiveDevice();
        const cur = dev?.einkAlgorithm || 'standard';
        const effective = sendPreviewFilterOptions.some(o => o.id === cur) ? cur : 'standard';
        const opts = sendPreviewFilterOptions.map(o => `
            <button type="button" class="settings-card w-full text-left mb-2 ${effective === o.id ? 'active' : ''}" onclick="setDeviceDefaultFilter('${o.id}')">
                <div class="flex justify-between items-center gap-3">
                    <span class="font-bold text-sm text-gray-900">${o.label}</span>
                    <i class="fa-solid ${effective === o.id ? 'fa-circle-dot text-gray-900' : 'fa-circle text-gray-300'}"></i>
                </div>
            </button>`).join('');
        openNasSheet(`
            <div class="p-4 border-b font-bold">默认滤镜</div>
            <div class="p-4 max-h-[55vh] overflow-y-auto">
                <p class="text-[11px] text-gray-500 mb-3">轮播与下发照片的默认渲染效果</p>
                ${opts}
            </div>
        `);
    }

    function openDeviceAlbumFitSheet() {
        const dev = getActiveDevice();
        const fitId = dev?.albumFitMode || 'smart-cover';
        const opts = albumFitModeOptions.map(opt => {
            const checked = fitId === opt.id;
            return `
            <button type="button" class="settings-card w-full text-left mb-2 ${checked ? 'active' : ''}" onclick="setAlbumFitMode('${opt.id}');closeNasSheet()">
                <div class="flex justify-between items-start gap-3">
                    <div class="flex-1 min-w-0">
                        <div class="font-bold text-sm text-gray-900">${opt.label}${opt.isDefault ? ' <span class="text-[10px] font-normal text-gray-400">（默认）</span>' : ''}</div>
                        <div class="text-[10px] text-gray-500 mt-0.5">${opt.tech}</div>
                    </div>
                    <i class="fa-solid ${checked ? 'fa-circle-dot text-gray-900' : 'fa-circle text-gray-300'} mt-0.5 shrink-0"></i>
                </div>
                <p class="text-xs text-gray-600 mt-2 leading-relaxed">${opt.behavior}</p>
            </button>`;
        }).join('');
        openNasSheet(`
            <div class="p-4 border-b font-bold">相册自动适配</div>
            <div class="p-4 max-h-[55vh] overflow-y-auto">
                <p class="text-[11px] text-gray-500 mb-3">轮播与下发照片的默认画幅策略</p>
                ${opts}
            </div>
        `);
    }

    function setDeviceDisplayOrientation(id) {
        const dev = getActiveDevice();
        if (!dev) return;
        dev.displayOrientation = id;
        closeNasSheet();
        nasToast(`展示方向：${getDisplayOrientationLabel(dev)}`);
        renderNasApp();
    }

    function openDeviceDisplayOrientationSheet() {
        const dev = getActiveDevice();
        const cur = dev?.displayOrientation || 'landscape';
        const opts = [
            { id: 'landscape', label: '横屏摆放', desc: '相框横向放置，宽画幅优先' },
            { id: 'portrait', label: '竖屏摆放', desc: '相框纵向放置，竖画幅优先' }
        ].map(o => `
            <button type="button" class="settings-card w-full text-left mb-2 ${cur === o.id ? 'active' : ''}"
                onclick="setDeviceDisplayOrientation('${o.id}')">
                <div class="flex justify-between items-center gap-3">
                    <div>
                        <div class="font-bold text-sm">${o.label}</div>
                        <div class="text-[10px] text-gray-500 mt-0.5">${o.desc}</div>
                    </div>
                    <i class="fa-solid ${cur === o.id ? 'fa-circle-dot text-gray-900' : 'fa-circle text-gray-300'}"></i>
                </div>
            </button>`).join('');
        openNasSheet(`
            <div class="p-4 border-b font-bold">展示方向</div>
            <div class="p-4">${opts}</div>
        `);
    }

    function renderDeviceSettingsHeader(title = '设备设置') {
        const backLabel = state._deviceSettingsReturn === 'send-device' ? '返回发送' : '返回';
        return `
            <div class="flex items-center justify-between px-4 py-3 bg-white border-b border-gray-200 shrink-0 sticky top-0 z-20">
                <button type="button" class="w-10 h-10 flex items-center justify-center -ml-2 text-gray-800" onclick="nasGoBack()" aria-label="${backLabel}"><i class="fa-solid fa-chevron-left text-lg"></i></button>
                <h2 class="font-bold text-base flex-1 text-center pointer-events-none -ml-10">${title}</h2>
                <span class="w-10 h-10 shrink-0" aria-hidden="true"></span>
            </div>`;
    }

    function renderDeviceSettings() {
        const dev = getActiveDevice();
        const chevron = '<i class="fa-solid fa-chevron-right text-[10px] text-gray-300"></i>';
        const fwBadge = dev.firmwareUpdateAvailable ? '<span class="device-settings-badge">可更新</span>' : '';

        return `
        <div class="device-settings-page ${!dev.online ? 'opacity-75' : ''}">
            ${renderDeviceSettingsHeader('设备设置')}
            <div class="device-settings-scroll">
                <div class="device-settings-section-hd">设备信息</div>
                <div class="device-settings-group">
                    <button type="button" class="device-settings-row" onclick="nasToast('重命名设备')">
                        <span class="row-label">设备名称</span>
                        <span class="row-value">${dev.productName || dev.name}${chevron}</span>
                    </button>
                    <div class="device-settings-row">
                        <span class="row-label">序列号 (SN)</span>
                        <span class="row-value">
                            ${dev.serialNumber || '—'}
                            <button type="button" class="row-copy" onclick="copyDeviceSerial()" aria-label="复制序列号"><i class="fa-regular fa-copy"></i></button>
                        </span>
                    </div>
                    <div class="device-settings-row">
                        <span class="row-label">MAC 地址</span>
                        <span class="row-value">${dev.macAddress || '—'}</span>
                    </div>
                    <div class="device-settings-row">
                        <span class="row-label">屏幕尺寸</span>
                        <span class="row-value">${dev.screenSize || '—'}</span>
                    </div>
                </div>

                <div class="device-settings-section-hd">网络与展示</div>
                <div class="device-settings-group">
                    <button type="button" class="device-settings-row" onclick="nasToast('Wi-Fi 设置')">
                        <span class="row-label">Wi-Fi 网络</span>
                        <span class="row-value">${dev.wifiNetwork || '—'}${chevron}</span>
                    </button>
                    <button type="button" class="device-settings-row" onclick="openDeviceDisplayOrientationSheet()">
                        <span class="row-label">展示方向</span>
                        <span class="row-value">${getDisplayOrientationLabel(dev)}${chevron}</span>
                    </button>
                    <button type="button" class="device-settings-row multi-line" onclick="openDeviceAlbumFitSheet()">
                        <div class="row-left">
                            <div class="row-label">相册自动适配</div>
                            <div class="row-sub">轮播与下发照片的默认画幅策略</div>
                        </div>
                        <span class="row-value">${getAlbumFitModeLabel(dev)}${chevron}</span>
                    </button>
                    <button type="button" class="device-settings-row multi-line" onclick="openDeviceDefaultFilterSheet()">
                        <div class="row-left">
                            <div class="row-label">默认滤镜</div>
                            <div class="row-sub">轮播与下发照片的默认渲染效果</div>
                        </div>
                        <span class="row-value">${getDefaultFilterLabel(dev)}${chevron}</span>
                    </button>
                </div>

                <div class="device-settings-section-hd">维护</div>
                <div class="device-settings-group">
                    <button type="button" class="device-settings-row" onclick="nasToast('检查固件更新')">
                        <span class="row-label">固件升级</span>
                        <span class="row-value">${fwBadge}${dev.firmwareVersion || '—'}${chevron}</span>
                    </button>
                    <button type="button" class="device-settings-row" onclick="nasToast('恢复出厂设置')">
                        <span class="row-label">恢复出厂设置</span>
                        <span class="row-value">${chevron}</span>
                    </button>
                    <button type="button" class="device-settings-row" onclick="nasToast('已解除绑定')">
                        <span class="row-label">解除绑定</span>
                        <span class="row-value">${chevron}</span>
                    </button>
                </div>
            </div>
        </div>`;
    }

    function renderDeviceHomePlanPane(opts = {}) {
        const dev = getActiveDevice();
        const offline = !dev.online;
        const isAlbumPlan = isPlanAlbumMode();
        const items = state.planEmpty ? [] : getSortedPlanItems();
        const paused = isPlanDisplayPaused();
        const restCount = items.filter(i => i.status !== 'playing').length;
        const canShuffle = restCount >= 2;
        const canClear = restCount > 0;
        const pauseIcon = paused ? 'fa-play' : 'fa-stop';
        const pauseLabel = paused ? '恢复播放' : '停止展示';
        const albumRow = isAlbumPlan ? `
                <div class="plan-album-name">
                    <span class="label">轮播图册</span>
                    <span class="name truncate">${dev.carouselAlbum || '未选择'}</span>
                </div>` : '';

        const configCard = `
            <div class="bg-white rounded-xl border border-gray-200 p-4 shadow-sm mb-4">
                ${albumRow}
                <div class="plan-toolbar-row">
                    <label class="plan-interval-field">
                        <span class="interval-label">展示间隔</span>
                        <select onchange="setDisplayInterval(this.value)">
                            ${displayIntervalOptions.map(opt => `<option value="${opt.id}" ${state.displayInterval === opt.id ? 'selected' : ''}>${opt.label}</option>`).join('')}
                        </select>
                    </label>
                    <div class="plan-action-row">
                        <button type="button" class="plan-action-icon ${paused ? 'active' : ''}" onclick="togglePlanPause()" aria-label="${pauseLabel}"><i class="fa-solid ${pauseIcon}"></i></button>
                        <button type="button" class="plan-action-icon ${canShuffle ? '' : 'disabled'}" ${canShuffle ? 'onclick="shufflePlanQueue()"' : 'disabled'} aria-label="打乱"><i class="fa-solid fa-shuffle"></i></button>
                        <button type="button" class="plan-action-icon danger ${canClear ? '' : 'disabled'}" ${canClear ? 'onclick="openClearPlanConfirm()"' : 'disabled'} aria-label="一键清空"><i class="fa-solid fa-trash-can"></i></button>
                    </div>
                </div>
                ${offline ? '<p class="text-[10px] text-gray-400">规则变更在设备联网后生效</p>' : ''}
            </div>`;

        const emptyBlock = `
            <div class="flex flex-col items-center justify-center py-12 opacity-70">
                <i class="fa-regular fa-calendar-check text-4xl text-gray-300 mb-3"></i>
                <h4 class="font-bold text-gray-700 text-sm">还没有计划</h4>
                <p class="text-xs text-gray-400 mt-2 text-center px-6">在图库管理选图发送到本相框后，将出现在时间轴</p>
            </div>`;

        const padClass = opts.embedded
            ? (isDesktop() ? 'pt-4 pb-2' : 'px-0 pb-24 pt-3')
            : (isDesktop() ? 'p-4' : 'px-4 pb-24 pt-3');
        return `<div class="${padClass}">${configCard}${items.length ? renderPlanTimeline(items, isAlbumPlan) : emptyBlock}</div>`;
    }

    function renderDevicePlanSettings() {
        const dev = getActiveDevice();
        const offline = !dev.online;
        const framePreview = renderDeviceFramePreview();
        const planBody = renderDeviceHomePlanPane();

        if (isDesktop()) {
            return `
            <div class="h-full flex flex-col bg-gray-50 ${offline ? 'opacity-75' : ''}">
                <header class="px-5 py-3 bg-white border-b flex items-center gap-3 shrink-0">
                    <button type="button" class="text-gray-600" onclick="nasGoBack()"><i class="fa-solid fa-arrow-left"></i></button>
                    <div class="flex-1 min-w-0">
                        <h1 class="font-bold">${dev.name} · 计划</h1>
                        <p class="text-xs text-gray-500">${offline ? '离线' : '在线'}</p>
                    </div>
                </header>
                <div class="flex-1 overflow-y-auto min-h-0">
                    <div class="p-4 flex gap-4 items-start">
                        <div class="w-[42%] shrink-0">${framePreview}</div>
                        <div class="flex-1 min-w-0 bg-gray-50 rounded-xl border border-gray-200 overflow-hidden">
                            ${planBody.replace(/\bpx-4\b/g, 'px-5')}
                        </div>
                    </div>
                </div>
            </div>`;
        }

        return `
        <div class="h-full flex flex-col bg-gray-50 pb-2 ${offline ? 'opacity-75' : ''}">
            ${renderDeviceSettingsHeader('计划')}
            <div class="flex-1 overflow-y-auto min-h-0 bg-gray-50">
                <div class="px-4 pt-3">${framePreview}</div>
                ${planBody}
            </div>
        </div>`;
    }

    function switchDeviceHomeTab(tab) {
        state.deviceHomeTab = tab;
        state.currentNavId = resolveDeviceHomeNavId();
        renderNasApp();
        updateAnnotation();
        renderPageTree();
    }

    function renderDeviceHomeBelowFrame() {
        if (state.deviceHomeVariant === 'p0') {
            return renderDeviceHomePlanPane({ embedded: true });
        }
        return renderDeviceHomeActionSection() + renderDeviceHomeBottomSection();
    }

    function renderDeviceHome() {
        const dev = getActiveDevice();
        const offline = !dev.online;
        const framePreview = renderDeviceFramePreview();
        const belowFrame = renderDeviceHomeBelowFrame();

        if (isDesktop()) {
            return `
            <div class="h-full flex flex-col bg-gray-50 ${offline ? 'opacity-75' : ''}">
                <header class="px-5 py-3 bg-white border-b flex items-center gap-3 shrink-0">
                    <button type="button" class="text-gray-600" onclick="nasGoBack()"><i class="fa-solid fa-arrow-left"></i></button>
                    <div class="flex-1 min-w-0">
                        <h1 class="font-bold">${dev.productName || dev.name}</h1>
                        <p class="text-xs text-gray-500">${offline ? '离线' : '在线'} · ${dev.battery != null ? dev.battery + '%' : '—'}</p>
                    </div>
                    <button type="button" class="text-gray-500" onclick="openDeviceSettings('device-home')" aria-label="设备设置"><i class="fa-solid fa-gear"></i></button>
                </header>
                <div class="flex-1 overflow-y-auto min-h-0">
                    <div class="p-6 max-w-2xl mx-auto space-y-0">
                        ${framePreview}
                        <div class="px-1">${belowFrame}</div>
                    </div>
                </div>
            </div>`;
        }

        return `
        <div class="h-full flex flex-col bg-gray-50 ${offline ? 'opacity-75' : ''}">
            ${renderDeviceHomeHeader(dev, offline)}
            <div class="flex-1 overflow-y-auto min-h-0 bg-gray-50 px-4 pt-3 pb-6">
                ${framePreview}
                ${belowFrame}
            </div>
        </div>`;
    }

    function getDevicePlanSummaryRight() {
        if (state.planEmpty || !state.planItems.length) return '暂无待播';
        const waiting = state.planItems.filter(i => i.status === 'waiting' || i.status === 'pending').length;
        if (waiting) return `${waiting} 条等待下发`;
        return `${state.planItems.length} 条计划`;
    }

    function openDeviceHomeSendPhotos() {
        state.sendTargetId = state.activeDeviceId;
        state._sendReturnToDeviceHome = true;
        state._sendAlbumImmediate = false;
        state.pageStack = ['device-home'];
        state.currentPage = 'library';
        state.nasTab = 'library';
        state.activeNasModule = 'library';
        state.libraryTab = 'gallery';
        state.libraryView = 'stream';
        state.galleryStreamMode = 'day';
        state.libraryAlbumBrowse = false;
        state.activeAlbumId = null;
        state.albumDetailMenuOpen = false;
        state.timelineView = 'list';
        state.activeTimelineAlbumId = null;
        state.gallerySendSelectMode = false;
        state.gallerySelected = [];
        state.currentNavId = 'library-folders';
        renderNasApp();
        updateAnnotation();
        renderPageTree();
    }

    function openDeviceHomeSendAlbum() {
        state.sendTargetId = state.activeDeviceId;
        state._sendReturnToDeviceHome = true;
        state._sendAlbumImmediate = false;
        state.pageStack = ['device-home'];
        state.currentPage = 'library';
        state.nasTab = 'library';
        state.activeNasModule = 'library';
        state.libraryTab = 'albums';
        state.libraryView = 'timeline';
        state.timelineView = 'list';
        state.activeTimelineAlbumId = null;
        state.libraryAlbumBrowse = false;
        state.activeAlbumId = null;
        state.albumDetailMenuOpen = false;
        state.gallerySendSelectMode = false;
        state.gallerySelected = [];
        state.currentNavId = 'library-albums';
        renderNasApp();
        updateAnnotation();
        renderPageTree();
    }

    function applyDeviceWatermark(wmId) {
        const wm = deviceWatermarkPresets.find(w => w.id === wmId);
        if (!wm) return;
        const dev = getActiveDevice();
        nasToast(dev.online ? `「${wm.name}」水印已应用到 ${dev.name}` : `「${wm.name}」已设置，等待设备上线`);
    }

    function sendArtPhotoToDevice(photoName) {
        state.sendTargetId = state.activeDeviceId;
        state.sendPhotos = [photoName];
        state.sendPreviewIndex = 0;
        state.pageStack = ['device-home'];
        state.currentPage = 'send-device';
        state.currentNavId = 'library-send-single';
        renderNasApp();
        updateAnnotation();
        renderPageTree();
    }

    function renderDeviceHomeWatermarkPane() {
        const cards = deviceWatermarkPresets.map(w => `
            <button type="button" class="device-watermark-card" onclick="applyDeviceWatermark('${w.id}')">
                <i class="fa-solid ${w.icon}"></i>
                <span class="wm-name">${w.name}</span>
            </button>`).join('');
        return `<div class="device-watermark-grid">${cards}</div>`;
    }

    function renderDeviceHomeArtPane() {
        const cells = deviceArtPhotos.map(name => `
            <button type="button" class="device-art-cell" onclick="sendArtPhotoToDevice('${name.replace(/'/g, "\\'")}')">
                ${renderImgPlaceholder('')}
                <span class="thumb-caption">${formatPhotoDate(getPhotoDate(name))}</span>
            </button>`).join('');
        return `<div class="device-home-art-grid">${cells}</div>`;
    }

    function renderDeviceHomeBottomSection() {
        const tab = state.deviceHomeTab;
        const pane = tab === 'art' ? renderDeviceHomeArtPane() : renderDeviceHomeWatermarkPane();
        return `
        <div class="device-home-bottom">
            <div class="device-home-tabs">
                <button type="button" class="${tab === 'watermark' ? 'active' : ''}" onclick="switchDeviceHomeTab('watermark')">水印</button>
                <button type="button" class="${tab === 'art' ? 'active' : ''}" onclick="switchDeviceHomeTab('art')">艺术图库</button>
            </div>
            <div class="device-home-pane">${pane}</div>
        </div>`;
    }

    function renderDeviceHomeHeader(dev, offline) {
        const title = dev.productName || dev.name;
        const statusLine = offline
            ? `<span class="device-home-status-dot offline"></span><span>离线</span>`
            : `<span class="device-home-status-dot"></span><span>在线</span><span><i class="fa-solid fa-battery-three-quarters ml-2 mr-0.5"></i>${dev.battery != null ? dev.battery + '%' : '--'}</span>`;
        return `
        <div class="flex items-center justify-between p-4 bg-white border-b sticky top-0 z-20 shrink-0">
            <button type="button" class="w-10 h-10 flex items-center justify-center -ml-2" onclick="nasGoBack()"><i class="fa-solid fa-arrow-left text-lg"></i></button>
            <div class="text-center pointer-events-none flex-1 min-w-0 px-2">
                <h2 class="font-bold text-base truncate">${title}</h2>
                <div class="text-[10px] text-gray-500 flex items-center justify-center gap-2 mt-0.5">${statusLine}</div>
            </div>
            <button type="button" class="w-10 h-10 flex items-center justify-center -mr-2" onclick="openDeviceSettings('device-home')" aria-label="设备设置"><i class="fa-solid fa-gear"></i></button>
        </div>`;
    }

    function renderDeviceHomeActionSection() {
        const planRight = getDevicePlanSummaryRight();
        return `
        <div class="device-home-actions">
            <button type="button" class="device-home-action-btn secondary" onclick="openDeviceHomeSendPhotos()">
                <i class="fa-solid fa-paper-plane"></i><span>发送图片</span>
            </button>
            <button type="button" class="device-home-action-btn secondary" onclick="openDeviceHomeSendAlbum()">
                <i class="fa-solid fa-book-open"></i><span>发送相册</span>
            </button>
        </div>
        <button type="button" class="device-home-plan-row" onclick="openDevicePlanSettings('device-home')">
            <div class="device-home-plan-icon"><i class="fa-solid fa-list-ul text-sm"></i></div>
            <div class="flex-1 min-w-0">
                <div class="text-sm font-bold text-gray-900">计划</div>
                <div class="text-[11px] text-gray-400 mt-0.5">待播时间轴 · 展示间隔与轮播</div>
            </div>
            <span class="text-[11px] text-gray-500 shrink-0">${planRight} <i class="fa-solid fa-chevron-right text-[9px]"></i></span>
        </button>`;
    }

    function getSmarthomeRooms() {
        return [...new Set(state.devices.map(d => d.room).filter(Boolean))];
    }

    function getFilteredDevices() {
        const list = state.familyEmpty ? [] : state.devices;
        if (state.smarthomeRoomFilter === 'all') return list;
        return list.filter(d => d.room === state.smarthomeRoomFilter);
    }

    function setSmarthomeRoomFilter(room) {
        state.smarthomeRoomFilter = room;
        renderNasApp();
    }

    function isUgreenHomeControlled(d) {
        return d.controlledBy === 'ugreen-home';
    }

    function getDeviceStatusLabel(d) {
        if (isUgreenHomeControlled(d)) return 'UGREEN Home 控制中';
        return d.online ? '在线' : '离线';
    }

    function getDeviceMetaLine(d) {
        const parts = [d.room];
        if (!isUgreenHomeControlled(d)) parts.push(getDeviceStatusLabel(d));
        if (d.online && !isUgreenHomeControlled(d) && d.battery != null) parts.push(`${d.battery}%`);
        if (d.shared) parts.push('分享');
        return parts.join(' · ');
    }

    function reconnectNasControl(deviceId) {
        const dev = state.devices.find(d => d.id === deviceId);
        if (!dev) return;
        dev.controlledBy = 'nas';
        dev.online = true;
        nasToast(`NAS 已连接并接管「${dev.name}」`);
        renderNasApp();
        updateAnnotation();
        renderPageTree();
    }

    function renderFrameGridCard(d) {
        const controlled = isUgreenHomeControlled(d);
        const badge = controlled ? '<span class="device-control-badge">UGREEN Home 控制中</span>' : '';
        const reconnect = controlled ? `
            <div class="device-control-row" onclick="event.stopPropagation()">
                <button type="button" onclick="reconnectNasControl('${d.id}')">连接</button>
            </div>` : '';
        return `
        <div class="smarthome-device-card" role="button" tabindex="0" onclick="openDeviceHome('${d.id}')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();openDeviceHome('${d.id}')}">
            <div class="card-icon img-placeholder"><i class="fa-solid fa-tablet-screen-button"></i></div>
            <div class="card-name">${d.name}</div>
            <div class="card-meta">${getDeviceMetaLine(d)}</div>
            ${badge}
            ${reconnect}
        </div>`;
    }

    function renderSmarthomeMobileHome() {
        const list = getFilteredDevices();
        const rooms = getSmarthomeRooms();
        const roomTabs = `
            <button type="button" class="${state.smarthomeRoomFilter === 'all' ? 'active' : ''}" onclick="setSmarthomeRoomFilter('all')">全部</button>
            ${rooms.map(r => `
                <button type="button" class="${state.smarthomeRoomFilter === r ? 'active' : ''}" onclick="setSmarthomeRoomFilter('${r.replace(/'/g, "\\'")}')">${r}</button>
            `).join('')}`;
        const grid = list.length
            ? `<div class="smarthome-device-grid">${list.map(renderFrameGridCard).join('')}</div>`
            : `<div class="px-4">${renderFamilyEmpty(false)}</div>`;

        return `
        <div class="smarthome-page pb-4">
            <div class="smarthome-topbar">
                ${renderAppCloseBtn()}
                <span class="smarthome-topbar-spacer" aria-hidden="true"></span>
                <div class="smarthome-topbar-actions">
                    <button type="button" onclick="switchNasPage('add-frame')" aria-label="添加相框"><i class="fa-solid fa-plus"></i></button>
                    <button type="button" onclick="nasToast('更多')" aria-label="更多"><i class="fa-solid fa-ellipsis"></i></button>
                </div>
            </div>
            <div class="smarthome-home-title">
                <h1>我的家</h1>
            </div>
            <div class="smarthome-room-scroll">${roomTabs}</div>
            ${grid}
        </div>`;
    }

    function renderSmarthomeDesktopHome() {
        const list = getFilteredDevices();
        const rooms = getSmarthomeRooms();
        const roomTabs = `
            <button type="button" class="${state.smarthomeRoomFilter === 'all' ? 'active' : ''}" onclick="setSmarthomeRoomFilter('all')">全部</button>
            ${rooms.map(r => `
                <button type="button" class="${state.smarthomeRoomFilter === r ? 'active' : ''}" onclick="setSmarthomeRoomFilter('${r.replace(/'/g, "\\'")}')">${r}</button>
            `).join('')}`;
        const grid = list.length
            ? `<div class="smarthome-device-grid">${list.map(renderFrameGridCard).join('')}</div>`
            : renderFamilyEmpty(true);

        return `
        <div class="h-full flex flex-col bg-[#f5f5f7]">
            <header class="px-6 py-4 bg-white border-b border-gray-200 flex justify-between items-center shrink-0">
                <div class="min-w-0">
                    <h1 class="text-lg font-bold">我的家</h1>
                    <p class="text-xs text-gray-500 mt-0.5">DX4600 · 本机 NAS · 共 ${state.devices.length} 台相框</p>
                </div>
                <div class="flex items-center gap-3 shrink-0">
                    <button type="button" class="px-4 py-2 bg-gray-900 text-white rounded-lg text-sm font-bold" onclick="switchNasPage('add-frame')">
                        <i class="fa-solid fa-plus mr-1"></i>添加相框
                    </button>
                    ${renderAppCloseBtn()}
                </div>
            </header>
            <div class="smarthome-room-scroll shrink-0">${roomTabs}</div>
            <div class="flex-1 overflow-y-auto p-6">${grid}</div>
        </div>`;
    }

    /* ——— 页面渲染 ——— */
    function renderFamilyDevices() {
        if (isDesktop()) return renderSmarthomeDesktopHome();
        return renderSmarthomeMobileHome();
    }

    function renderFamilyEmpty(desktop) {
        const inner = `
            <div class="flex flex-col items-center justify-center py-16 px-6 text-center ${desktop ? 'bg-white rounded-xl border border-dashed' : ''}">
                <i class="fa-solid fa-tablet-screen-button text-4xl text-gray-300 mb-4"></i>
                <h3 class="font-bold text-gray-700 mb-2">还没有相框</h3>
                <p class="text-xs text-gray-500 mb-6 max-w-xs">添加第一台设备后，可在图库管理中选图并发送到相框</p>
                <button type="button" class="px-6 py-2.5 bg-gray-900 text-white rounded-full text-sm font-bold" onclick="switchNasPage('add-frame')">添加相框</button>
            </div>`;
        return inner;
    }

    function renderAddFrame() {
        const back = `<button type="button" class="text-sm text-gray-600 mb-3" onclick="nasGoBack()"><i class="fa-solid fa-arrow-left mr-1"></i>返回</button>`;
        const body = `
            <div class="${isDesktop() ? 'p-8 max-w-lg mx-auto' : 'p-4'}">
                ${!isDesktop() ? '' : back}
                <h2 class="text-lg font-bold mb-1">添加相框</h2>
                <p class="text-xs text-gray-500 mb-4">通过局域网发现待绑定设备（NAS 无需蓝牙）</p>
                <button type="button" class="w-full py-3 bg-gray-900 text-white rounded-xl font-bold text-sm mb-4" onclick="state.scanFound=true;renderNasApp()">
                    ${state.scanFound ? '重新扫描' : '扫描局域网设备'}
                </button>
                ${state.scanFound ? `
                <div class="bg-white rounded-xl border divide-y text-sm mb-4">
                    <div class="p-3 flex justify-between items-center">
                        <span>UGREEN Frame A102</span>
                        <button type="button" class="text-xs px-3 py-1 border rounded-full font-bold" onclick="nasToast('请输入设备屏幕配对码')">绑定</button>
                    </div>
                    <div class="p-3 flex justify-between items-center">
                        <span>UGREEN Frame C207</span>
                        <button type="button" class="text-xs px-3 py-1 border rounded-full font-bold" onclick="nasToast('请输入设备屏幕配对码')">绑定</button>
                    </div>
                </div>` : ''}
                <div class="text-sm space-y-2 border-t pt-4">
                    <button type="button" class="w-full text-left py-2 text-gray-700" onclick="nasToast('手动输入 SN / 配对码')">手动添加（配对码）</button>
                    <button type="button" class="w-full text-left py-2 text-gray-700" onclick="nasToast('配置相框 Wi-Fi')">配置相框 Wi-Fi</button>
                </div>
            </div>`;
        if (isDesktop()) {
            return `<div class="h-full bg-gray-50 flex flex-col"><header class="px-6 py-4 bg-white border-b"><h1 class="font-bold">添加相框</h1></header><div class="flex-1 overflow-y-auto">${body}</div></div>`;
        }
        return `<div class="min-h-full bg-gray-50"><div class="p-4 bg-white border-b sticky top-0">${back.replace('mb-3','')}</div>${body}</div>`;
    }

    function renderGalleryBreadcrumb() {
        const path = state.galleryPath;
        const parts = path.split('/').filter(Boolean);
        let acc = '';
        const bcParts = [`<span class="nas-bc cursor-pointer hover:underline" data-path="/Homes/Photos">Photos</span>`];
        parts.forEach(p => { acc += '/' + p; bcParts.push(`<span>/</span><span class="nas-bc cursor-pointer hover:underline" data-path="${acc}">${p}</span>`); });
        return bcParts.join('');
    }

    function renderGalleryFoldersPane() {
        const path = state.galleryPath;
        const items = nasFolders[path] || [];
        const dirs = items.filter(i => i.type === 'dir');
        const files = items.filter(i => i.type === 'file');
        const bc = renderGalleryBreadcrumb();
        const parentBtn = path !== '/Homes/Photos'
            ? `<button type="button" class="col-span-full flex items-center gap-2 px-3 py-2 mb-1 rounded-lg bg-white border border-gray-200 text-sm text-gray-600" onclick="setGalleryPath('${path.split('/').slice(0,-1).join('/') || '/Homes/Photos'}')"><i class="fa-solid fa-level-up-alt"></i>上一级</button>`
            : '';
        const folderGrid = dirs.map(item => renderFolderTile(item.name, path + '/' + item.name)).join('');
        const photoGrid = files.map(item => renderThumbTile(item.name, {
            sendOnly: state.libraryTab === 'gallery' && !state.gallerySendSelectMode
        })).join('');
        const gridCols = isDesktop() ? 'grid-cols-4 xl:grid-cols-5' : 'grid-cols-3';
        const combinedGrid = `
            <div class="grid ${gridCols} gap-2 content-start">${parentBtn}${folderGrid}${photoGrid}</div>`;
        const emptyHint = !dirs.length && !files.length ? '<p class="text-sm text-gray-400 py-8 text-center">此文件夹暂无内容</p>' : '';

        if (isDesktop()) {
            const sidebarList = items.map(item => {
                const full = path + '/' + item.name;
                const isFile = item.type === 'file';
                return `<div class="flex items-center gap-2 px-2 py-1.5 rounded text-xs cursor-pointer hover:bg-gray-50 ${isFile && isPhotoSelected(item.name) ? 'bg-blue-50' : ''}"
                    onclick="${isFile ? `toggleGalleryFile('${item.name.replace(/'/g,"\\'")}')` : `setGalleryPath('${full.replace(/'/g,"\\'")}')`}">
                    <i class="fa-solid ${isFile ? 'fa-image' : 'fa-folder'} text-gray-400 w-3"></i>
                    <span class="truncate flex-1">${item.name}</span>
                </div>`;
            }).join('');
            return `
                <div class="px-5 py-2 bg-white border-b text-xs text-gray-500 shrink-0">${bc}</div>
                <div class="flex flex-1 min-h-0">
                    <aside class="w-52 bg-white border-r p-2 overflow-y-auto shrink-0 text-sm">
                        <div class="text-[10px] font-bold text-gray-400 mb-2 px-2 uppercase">目录树</div>
                        ${sidebarList}
                    </aside>
                    <main class="flex-1 overflow-y-auto p-4 min-w-0">${emptyHint || combinedGrid}</main>
                </div>`;
        }

        return `
            <div class="px-4 py-2 bg-gray-50 border-b text-[11px] text-gray-500 shrink-0 flex flex-wrap items-center">${bc}</div>
            <div class="flex-1 overflow-y-auto p-3 min-h-0">${emptyHint || combinedGrid}</div>`;
    }

    function renderTimelinePane() {
        if (state.timelineView === 'detail' && state.activeTimelineAlbumId) {
            return renderTimelineAlbumDetail();
        }
        return renderTimelineAlbumList();
    }

    function renderLibraryPage() {
        const showGallerySendBar = state.gallerySendSelectMode && state.libraryTab === 'gallery' && !state.libraryAlbumBrowse;
        const showAlbumActionBar = state.gallerySelected.length && state.libraryTab === 'albums' && state.libraryAlbumBrowse;
        const showFolderLegacyBar = state.gallerySelected.length && state.libraryTab === 'gallery'
            && state.galleryStreamMode === 'folder' && !state.libraryAlbumBrowse && !state.gallerySendSelectMode;
        const showActionBar = showGallerySendBar || showAlbumActionBar || showFolderLegacyBar;
        const actionBar = showActionBar ? renderGalleryActionBar() : '';
        const body = renderLibraryBody();
        const inTimelineDetail = state.libraryTab === 'albums' && state.timelineView === 'detail' && state.activeTimelineAlbumId;
        const inTimeList = state.libraryTab === 'albums' && state.timelineView === 'time-list';
        const inAlbumBrowse = (state.libraryTab === 'gallery' || state.libraryTab === 'albums') && state.libraryAlbumBrowse;
        const tabLabels = { gallery: '图库', albums: '相册', smart: '分类', settings: '我的' };
        const subtitle = inTimelineDetail && getTimelineAlbum(state.activeTimelineAlbumId)
            ? getTimelineAlbum(state.activeTimelineAlbumId).name
            : (inAlbumBrowse ? state._browseAlbumName : tabLabels[state.libraryTab] || '图库');

        if (isDesktop()) {
            const hideTopHeader = state.libraryTab === 'gallery'
                || state.libraryTab === 'smart'
                || state.libraryTab === 'settings'
                || (state.libraryTab === 'albums' && !inTimeList);
            const desktopHeader = hideTopHeader ? '' : `

    function bindSendFrameCrop(root) {
        const viewport = root.querySelector('[data-send-crop-viewport]');
        if (!viewport) return;
        const photoName = viewport.getAttribute('data-photo-name');
        const layer = viewport.querySelector('[data-send-crop-layer]');
        if (!photoName || !layer) return;

        let dragging = false;
        let startX = 0;
        let startY = 0;
        let startCropX = 0;
        let startCropY = 0;

        const onStart = (e) => {
            if (e.target.closest('button')) return;
            e.preventDefault();
            const pt = getEventClientPoint(e);
            if (!pt) return;
            dragging = true;
            viewport.classList.add('is-dragging');
            startX = pt.x;
            startY = pt.y;
            const c = getSendCrop(photoName);
            startCropX = c.x;
            startCropY = c.y;
        };
        const onMove = (e) => {
            if (!dragging) return;
            e.preventDefault();
            const pt = getEventClientPoint(e);
            if (!pt) return;
            const c = getSendCrop(photoName);
            c.x = Math.round(startCropX + (pt.x - startX));
            c.y = Math.round(startCropY + (pt.y - startY));
            layer.style.transform = `translate(${c.x}px, ${c.y}px) scale(${c.scale})`;
        };
        const onEnd = () => {
            dragging = false;
            viewport.classList.remove('is-dragging');
        };

        viewport.addEventListener('mousedown', onStart);
        viewport.addEventListener('touchstart', onStart, { passive: false });
        window.addEventListener('mousemove', onMove);
        window.addEventListener('touchmove', onMove, { passive: false });
        window.addEventListener('mouseup', onEnd);
        window.addEventListener('touchend', onEnd);
    }
