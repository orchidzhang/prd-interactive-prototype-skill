    function finishSendFlow(mode, opts = {}) {
        const dev = state.devices.find(d => d.id === state.sendTargetId);
        const count = getSendPhotosList().length;
        const albumCtx = state.sendAlbumContext;
        const wasAlbumSend = !!albumCtx;
        const wasFromSendPreview = state.currentPage === 'send-device';
        const wasTimelineSend = !!state._timelineDetailAlbumId;
        if (albumCtx && dev) {
            dev.carouselAlbum = albumCtx.name;
            dev.playMode = 'album';
            state.carouselAlbumName = albumCtx.name;
            state.planViewMode = 'album';
            state.albumCarouselPaused = false;
        }
        if (dev && sendPreviewFilterOptions.some(o => o.id === state.sendPreviewFilter)) {
            dev.einkAlgorithm = state.sendPreviewFilter;
        }
        if (wasFromSendPreview && !wasTimelineSend && !wasAlbumSend && dev) {
            dev.playMode = 'single';
            state.planViewMode = 'image';
        }
        if (!opts.skipToast) {
            if (mode === 'immediate') {
                nasToast(dev?.online ? `已立即展示 ${count} 张 · ${dev.name}` : `已排队立即展示，等待「${dev?.name}」上线`);
            } else {
                nasToast(dev?.online ? `已加入计划队列 ${count} 张 · ${dev.name}` : `已排队，等待「${dev?.name}」上线`);
            }
        }
        state.gallerySelected = [];
        state.sendPhotos = [];
        state.sendAlbumContext = null;
        state.sendPreviewIndex = 0;
        state.sendPreviewFilter = 'standard';
        state.sendCropByPhoto = {};
        if (wasAlbumSend || (wasFromSendPreview && !wasTimelineSend)) {
            navigateToDeviceHomeP0AfterSend();
            return;
        }
        if (returnAfterDeviceHomeSend()) return;
        if (state._returnAlbumDetail && state.activeAlbumId) {
            const album = getActiveAlbum();
            state.libraryTab = 'gallery';
            state.libraryAlbumBrowse = true;
            state.libraryView = 'folders';
            state.currentPage = 'library';
            state.activeNasModule = 'library';
            if (album) {
                state.galleryPath = album.path;
                state._browseAlbumName = album.name;
            }
            state.currentNavId = 'library-album-detail';
            state._returnAlbumDetail = false;
        } else if (state.libraryView === 'timeline' && state._timelineDetailAlbumId) {
            state.activeTimelineAlbumId = state._timelineDetailAlbumId;
            state.timelineView = 'detail';
            state.libraryTab = 'albums';
            state.currentPage = 'library';
            const navMap = {
                'that-year-today': 'library-timeline-that-year',
                'three-years-ago': 'library-timeline-three-years',
                wedding: 'library-timeline-wedding',
                birthday: 'library-timeline-birthday',
                monthly: 'library-timeline-monthly'
            };
            state.currentNavId = navMap[state._timelineDetailAlbumId] || 'library-timeline-that-year';
            state._timelineDetailAlbumId = null;
        } else {
            state.pageStack = [];
            state.currentPage = 'library';
            state.nasTab = 'library';
            state.currentNavId = state.libraryView === 'timeline' ? 'library-albums' : 'library-folders';
            if (state.libraryView === 'timeline') {
                state.timelineView = state.activeTimelineAlbumId ? 'detail' : 'list';
            }
        }
        renderNasApp();
        updateAnnotation();
        renderPageTree();
    }

    function walkMenu(nodes, fn) {
        nodes.forEach(n => { fn(n); if (n.children) walkMenu(n.children, fn); });
    }

    function findMenuPath(id, nodes = menuTree, path = []) {
        for (const n of nodes) {
            const next = [...path, n.id];
            if (n.id === id) return next;
            if (n.children) {
                const found = findMenuPath(id, n.children, next);
                if (found) return found;
            }
        }
        return null;
    }

    function ensureMenuExpandedForNav(navId) {
        const path = findMenuPath(navId);
        if (!path) return;
        path.forEach(id => { state.expandedMenus[id] = true; });
    }

    function renderPageTree() {
        ensureMenuExpandedForNav(state.currentNavId);
        const ul = document.getElementById('nav-menu');
        function renderNode(node, depth = 0) {
            const padLeft = depth * 10 + 6;
            const hasChildren = node.children?.length;
            const expanded = state.expandedMenus[node.id];
            const isActive = state.currentNavId === node.id;
            if (hasChildren) {
                const groupLevel = depth === 0 ? 'nav-menu-group-l1' : 'nav-menu-group-sub';
                return `<li>
                    <div class="nav-menu-group ${groupLevel}" style="padding-left:${padLeft}px" onclick="toggleMenu('${node.id}')">
                        <i class="fa-solid fa-chevron-${expanded ? 'down' : 'right'}"></i>
                        <span class="truncate">${node.name}</span>
                    </div>
                    ${expanded ? `<ul class="mt-0.5">${node.children.map(c => renderNode(c, depth + 1)).join('')}</ul>` : ''}
                </li>`;
            }
            const leafPad = padLeft + (depth >= 2 ? 8 : depth ? 4 : 0);
            const platHint = node.id === 'plat-app' && state.platform === 'app' ? ' · 当前' : (node.id === 'plat-desktop' && state.platform === 'desktop' ? ' · 当前' : '');
            return `<li>
                <div class="nav-menu-leaf${isActive ? ' active' : ''}" style="padding-left:${leafPad}px"
                     onclick="navigateToMenu('${node.id}')">${node.name}${platHint}</div>
            </li>`;
        }
        ul.innerHTML = menuTree.map(g => renderNode(g)).join('');
    }

    function toggleMenu(id) {
        state.expandedMenus[id] = !state.expandedMenus[id];
        renderPageTree();
    }

    function findMenuNode(id, nodes = menuTree) {
        for (const n of nodes) {
            if (n.id === id) return n;
            if (n.children) { const f = findMenuNode(id, n.children); if (f) return f; }
        }
        return null;
    }

    function navigateToMenu(navId) {
        const node = findMenuNode(navId);
        if (!node) return;
        if (node.action) { node.action(); return; }
        if (node.children && !node.page) {
            toggleMenu(node.id);
            return;
        }
        if (node.page) {
            state.currentNavId = node.id;
            ensureMenuExpandedForNav(node.id);
            state.currentPage = node.page;
            if (node.stateOverride) Object.assign(state, node.stateOverride);
            if (node.page === 'app-home') {
                state.pageStack = [];
            } else if (node.page === 'family' || node.page === 'add-frame' || node.page === 'device-home' || node.page === 'device-settings' || node.page === 'device-plan-settings') {
                state.nasTab = 'family';
                if (!node.stateOverride?.activeNasModule) state.activeNasModule = 'smarthome';
            } else if (node.page === 'library' || node.page === 'send-pick-target' || node.page === 'send-device' || node.page === 'scheduled-send') {
                if (!node.stateOverride?.nasTab) state.nasTab = 'library';
                if (!node.stateOverride?.activeNasModule) state.activeNasModule = 'library';
            }
            if ((node.page === 'device-home' || node.page === 'device-settings' || node.page === 'device-plan-settings') && !state.activeDeviceId) state.activeDeviceId = 'd1';
            if (node.page === 'send-pick-target' || node.page === 'send-device' || node.page === 'scheduled-send') {
                if (node.page === 'send-device') state.pageStack = ['library', 'send-pick-target'];
                else state.pageStack = ['library'];
            } else {
                state.pageStack = [];
            }
            renderNasApp();
            updateAnnotation();
            renderPageTree();
        }
    }

    function updateAnnotation() {
        const key = state.currentNavId;
        document.getElementById('annotation-content').innerHTML = annotations[key] || '<p class="text-gray-400 text-xs">暂无标注</p>';
        document.getElementById('annotation-subtitle').textContent =
            state.platform === 'app' ? 'nasapp · App 端' : 'nasapp · 电脑端（浏览器 / 桌面套件）';
    }

    function resizeMonitor() {
        const stage = document.getElementById('preview-stage');
        const wrapper = document.getElementById('monitor-wrapper');
        const monitor = document.getElementById('preview-monitor');
        if (!stage || !wrapper || !monitor) return;
        const dim = MONITOR[state.platform];
        const pad = 96;
        const scale = Math.min(1, (stage.clientWidth - pad) / dim.w, (stage.clientHeight - pad) / dim.h);
        monitor.style.transform = `scale(${scale})`;
        wrapper.style.width = `${dim.w * scale}px`;
        wrapper.style.height = `${dim.h * scale}px`;
    }

    window.addEventListener('resize', resizeMonitor);

    setPlatform('app');
    navigateToMenu('app-home');
    setTimeout(resizeMonitor, 0);
</script>
</body>
</html>
